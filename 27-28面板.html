<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>今日面板 · 每天自动换</title>
<style>
  /* ================= 设计令牌 ================= */
  :root{
    --bg:#0d1117; --bg2:#090d12;
    --card:#161b22; --card2:#1b2129; --card3:#0f141b;
    --line:#232b36; --line2:#313b48;
    --text:#e8eef5; --dim:#9aa7b4; --dim2:#7d8794;
    --green:#3fb950; --blue:#58a6ff; --orange:#f0883e;
    --red:#f85149; --purple:#a371f7; --gold:#e3b341;
    --r-lg:16px; --r-md:12px; --r-sm:9px;
    --shadow:0 10px 30px rgba(0,0,0,.34);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
  body{
    background:
      radial-gradient(1100px 520px at 12% -12%,#16202e 0%,transparent 62%),
      radial-gradient(880px 420px at 100% -6%,#131a24 0%,transparent 58%),
      var(--bg);
    color:var(--text);padding:20px 18px 88px;line-height:1.66;font-size:15px;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei UI","Microsoft YaHei",system-ui,sans-serif;
  }
  ::selection{background:rgba(88,166,255,.28)}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-track{background:var(--bg2)}
  ::-webkit-scrollbar-thumb{background:#2b3543;border-radius:99px;border:2px solid var(--bg2)}
  ::-webkit-scrollbar-thumb:hover{background:#3a4655}
  .wrap{max-width:1180px;margin:0 auto}

  /* ================= 顶栏 ================= */
  header{position:relative;overflow:hidden;box-shadow:var(--shadow);
    background:linear-gradient(135deg,#182130,#121823 58%,#0f141d);
    border:1px solid var(--line);border-radius:var(--r-lg);padding:18px 20px;margin-bottom:15px}
  header::after{content:"";position:absolute;left:0;right:0;top:0;height:2px;
    background:linear-gradient(90deg,#3b9dff,#3fb950 46%,rgba(63,185,80,0))}
  .top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  h1{font-size:22px;font-weight:700;letter-spacing:.2px;font-variant-numeric:tabular-nums}
  .badge{font-size:11.5px;padding:3px 10px;border-radius:99px;font-weight:700;letter-spacing:.3px}
  .nav{margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .nav button{background:var(--card2);color:var(--text);border:1px solid var(--line);
    padding:6px 12px;border-radius:var(--r-sm);cursor:pointer;font-size:12.5px;font-family:inherit;
    transition:border-color .15s,background .15s,transform .1s}
  .nav button:hover:not(:disabled){border-color:var(--line2);background:#222a34}
  .nav button:active:not(:disabled){transform:translateY(1px)}
  .nav button:disabled{opacity:.32;cursor:not-allowed}
  .nav .navlink{display:inline-block;background:#1f6feb;color:#fff;border:1px solid #388bfd;
    border-radius:var(--r-sm);padding:5px 11px;font-size:13px;font-weight:700;text-decoration:none;
    line-height:1.5;transition:background .15s}
  .nav .navlink:hover{background:#388bfd}

  /* ================= 状态条 / 焦点区 ================= */
  .meta{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px;font-size:12.5px;color:var(--dim)}
  .meta > span{background:var(--card3);border:1px solid var(--line);border-radius:99px;
    padding:2px 9px;line-height:1.75;font-variant-numeric:tabular-nums}
  .meta b{color:var(--text);font-weight:700}
  .meta > span[style*="ff7b72"]{border-color:#6b2f33;background:#2a1518}
  .focus{margin-top:13px;background:linear-gradient(180deg,#0e141c,#0b1017);
    border:1px solid var(--line);border-radius:var(--r-md);padding:13px 15px}
  .focus h3{font-size:11.5px;color:var(--dim2);font-weight:700;letter-spacing:.7px;margin-bottom:8px}
  .frow{display:flex;gap:10px;font-size:13.5px;padding:4px 0;align-items:baseline;
    border-top:1px dashed rgba(255,255,255,.045)}
  .frow:first-of-type{border-top:0}
  .frow .k{min-width:104px;font-weight:700;font-size:12.5px;letter-spacing:.2px}
  .frow .v{color:#c6d0da}

  /* ================= 进度 ================= */
  .barwrap{margin-top:14px;display:flex;align-items:center;gap:13px}
  .bar{flex:1;height:12px;background:#080b10;border-radius:99px;overflow:hidden;
    border:1px solid var(--line);box-shadow:inset 0 1px 2px rgba(0,0,0,.5)}
  .bar > i{display:block;height:100%;width:0;border-radius:99px;
    background:linear-gradient(90deg,#3b9dff,#3fb950);transition:width .35s ease;
    box-shadow:0 0 12px rgba(63,185,80,.35)}
  .pct{font-size:19px;font-weight:700;min-width:62px;text-align:right;
    font-variant-numeric:tabular-nums;letter-spacing:.3px}

  /* ================= 任务卡 ================= */
  .blocks{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:13px;margin-top:15px}
  .blk{background:linear-gradient(180deg,#171d25,#141920);border:1px solid var(--line);
    border-radius:var(--r-md);overflow:hidden;
    transition:border-color .18s,box-shadow .18s,transform .18s}
  .blk:hover{border-color:var(--line2);box-shadow:0 6px 18px rgba(0,0,0,.28);transform:translateY(-1px)}
  .blk .hd{display:flex;align-items:center;gap:9px;padding:11px 14px;
    border-bottom:1px solid var(--line);background:rgba(255,255,255,.014)}
  .blk .dot{width:9px;height:9px;border-radius:99px}
  .blk .nm{font-size:15px;font-weight:700;letter-spacing:.2px}
  .blk .min{margin-left:auto;font-size:11.5px;color:var(--dim);background:var(--card3);
    border:1px solid var(--line);border-radius:99px;padding:0 8px;font-variant-numeric:tabular-nums}
  .blk .bd{padding:11px 14px 12px}
  .blk .wk{font-size:12px;color:#e3b341;background:#1a1508;border:1px solid #3d2f0a;
    border-radius:var(--r-sm);padding:5px 9px;margin-bottom:9px;line-height:1.55}
  .daytag{display:inline-block;font-size:10.5px;font-weight:800;color:#0d1117;background:var(--dim);
    border-radius:4px;padding:0 5px;margin-right:6px;vertical-align:1px;letter-spacing:.2px}

  /* ================= 条目 / 复选框 ================= */
  ul{list-style:none;display:flex;flex-direction:column;gap:1px}
  li{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;color:#c6d0da;
    padding:5px 6px;margin:0 -6px;border-radius:var(--r-sm);line-height:1.62;
    transition:background .15s,opacity .2s}
  li:hover{background:rgba(255,255,255,.03)}
  li input{appearance:none;width:18px;height:18px;min-width:18px;margin-top:2px;
    border:1.5px solid #3f4a5a;border-radius:6px;cursor:pointer;position:relative;background:#0a0e14;
    transition:border-color .15s,background .15s,transform .1s}
  li input:hover{border-color:#5f6f86}
  li input:active{transform:scale(.92)}
  li input:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
  li input:checked{background:var(--green);border-color:var(--green)}
  li input:checked::after{content:"";position:absolute;left:5.5px;top:2.5px;width:4px;height:8.5px;
    border:solid #06210f;border-width:0 2.5px 2.5px 0;transform:rotate(43deg);
    animation:pop .18s ease-out}
  @keyframes pop{from{transform:rotate(43deg) scale(.35);opacity:0}to{transform:rotate(43deg) scale(1);opacity:1}}
  li.done{opacity:.55}
  li.done:hover{opacity:.85;background:transparent}
  li.done span,li.done .txt{color:var(--dim2);text-decoration:line-through;
    text-decoration-color:rgba(125,135,148,.7)}
  li span{cursor:pointer}
  .blk.complete{border-color:#2f6244;background:linear-gradient(180deg,#141f19,#141920)}
  .blk.complete .hd{border-bottom-color:#2f6244}

  /* ================= 📦 采购清单卡（2026-10-18 加） =================
     不算学习时长、不进 weekTotal，只存在于 W1（10-19 ~ 10-25）这个窗口。 */
  .pkg{margin-top:15px;background:linear-gradient(180deg,#171d25,#141920);
    border:1px solid #2d3f57;border-left:3px solid #d29922;border-radius:var(--r-md);padding:14px 16px}
  .pkg h2{font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .pkg h2 .cnt2{font-size:11.5px;font-weight:700;color:#0d1117;background:var(--gold);
    border-radius:99px;padding:1px 8px}
  .pkg .sub{font-size:12px;color:var(--dim2);margin:5px 0 10px;line-height:1.7}
  .pkg .row{display:flex;gap:10px;align-items:flex-start;padding:6px;margin:0 -6px;
    border-radius:var(--r-sm);transition:background .15s}
  .pkg .row:hover{background:rgba(255,255,255,.03)}
  .pkg .row input{appearance:none;width:18px;height:18px;min-width:18px;margin-top:2px;
    border:1.5px solid #3f4a5a;border-radius:6px;cursor:pointer;position:relative;background:#0a0e14;
    transition:border-color .15s,background .15s,transform .1s}
  .pkg .row input:hover{border-color:#5f6f86}
  .pkg .row input:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
  .pkg .row input:checked{background:var(--green);border-color:var(--green)}
  .pkg .row input:checked::after{content:"";position:absolute;left:5.5px;top:2.5px;width:4px;height:8.5px;
    border:solid #06210f;border-width:0 2.5px 2.5px 0;transform:rotate(43deg)}
  .pkg .q{flex:none;width:18px;height:18px;margin-top:2px;border-radius:5px;background:#233043;
    color:#8fb8e8;font-size:10.5px;font-weight:800;display:flex;align-items:center;justify-content:center}
  .pkg .txt{font-size:13.5px;color:#c6d0da;line-height:1.6;flex:1}
  .pkg .due{display:inline-block;font-size:11px;font-weight:700;color:#e3b341;background:#1a1508;
    border:1px solid #3d2f0a;border-radius:99px;padding:0 7px;margin-left:6px;white-space:nowrap;
    font-variant-numeric:tabular-nums}
  .pkg .due.hot{color:#ff7b72;background:#2a1518;border-color:#6b2f33}
  .pkg .row.done .txt{color:var(--dim2);text-decoration:line-through;
    text-decoration-color:rgba(125,135,148,.7)}
  .pkg .row.done .q{background:#1a2a20;color:#3fb950}
  .pkg .bar2{height:7px;background:#080b10;border-radius:99px;overflow:hidden;
    border:1px solid var(--line);margin:10px 0 2px}
  .pkg .bar2 > i{display:block;height:100%;width:0;border-radius:99px;
    background:linear-gradient(90deg,#d29922,#3fb950);transition:width .3s}
  .pkg details{margin-top:12px;border-top:1px dashed #2a323c;padding-top:10px}
  .pkg summary{cursor:pointer;font-size:12.5px;color:#e3b341;list-style:none;user-select:none}
  .pkg summary::-webkit-details-marker{display:none}
  .pkg summary::before{content:"▸ ";font-size:11px}
  .pkg details[open] summary::before{content:"▾ "}
  .pkg .later,.pkg .no{font-size:12.5px;color:var(--dim);line-height:1.9;margin-top:7px}
  .pkg .later b{color:#c6d0da}
  .pkg .no{margin-top:10px;padding-top:9px;border-top:1px dashed #2a323c}
  .pkg .no b{color:#ff9a91}
  @media (max-width:720px){
    .pkg{padding:12px 13px}
    .pkg .txt{font-size:13px}
    .pkg .due{display:block;margin:3px 0 0;width:fit-content}
  }

  /* ================= 其它 ================= */
  .adapt{background:var(--card);border:1px solid #2d3f57;border-left:3px solid var(--blue);
    border-radius:var(--r-md);padding:13px 16px;margin-top:15px;font-size:13.5px;
    color:var(--dim);line-height:1.78}
  .adapt b{color:#79c0ff}
  .empty{background:var(--card);border:1px dashed var(--line2);border-radius:var(--r-md);
    padding:34px 20px;text-align:center;color:var(--dim);font-size:14px;margin-top:15px;line-height:2}
  .tools{display:flex;gap:9px;margin-top:18px;flex-wrap:wrap}
  .tools button{background:var(--card2);color:var(--text);border:1px solid var(--line);
    padding:9px 16px;border-radius:var(--r-sm);cursor:pointer;font-size:13px;font-family:inherit;
    transition:border-color .15s,background .15s}
  .tools button:hover{border-color:var(--line2);background:#222a34}
  .tools button:focus-visible,.nav button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

  /* ---- 云同步面板 ---- */
  .syncbox{margin-top:13px;background:var(--card);border:1px solid var(--line);
    border-radius:var(--r-md);padding:14px 16px}
  .synchead{font-size:14px;font-weight:600;margin-bottom:8px}
  .synchead span{font-weight:400;font-size:12px;color:var(--dim2);margin-left:8px}
  .synctip{font-size:12px;color:var(--dim);line-height:1.8;margin:6px 0 10px}
  .synctip a{color:#58a6ff}
  .syncbox input[type=password]{width:100%;background:var(--card3);color:var(--text);
    border:1px solid var(--line);border-radius:var(--r-sm);padding:8px 10px;font-size:13px;
    font-family:inherit;margin-bottom:8px;transition:border-color .15s,box-shadow .15s}
  .syncbox input[type=password]:focus{outline:none;border-color:#1f6feb;
    box-shadow:0 0 0 2px rgba(31,111,235,.25)}
  .syncbox button{background:var(--card2);color:var(--text);border:1px solid var(--line);
    padding:7px 13px;border-radius:var(--r-sm);cursor:pointer;font-size:13px;
    font-family:inherit;margin:0 8px 6px 0}
  .syncbox button:hover{border-color:var(--line2);background:#222a34}
  .syncauto{font-size:12px;color:var(--dim);display:block;margin-top:4px}
  .syncmsg{font-size:12px;min-height:16px;margin-top:6px;color:var(--green)}
  footer{margin-top:26px;color:var(--dim2);font-size:11.5px;text-align:center;line-height:1.9}

  /* ================= 响应式 ================= */
  @media (max-width: 720px){
    body{overflow-x:hidden;padding:14px 12px 72px}
    li, .blk .nm, .wk{overflow-wrap:anywhere;word-break:break-word}
    header{padding:15px;border-radius:14px}
    h1{font-size:19px}
    .meta{gap:6px;font-size:11.5px}
    .meta > span{padding:1px 8px}
    .focus{padding:12px 13px}
    .frow{flex-direction:column;gap:3px}
    .frow .k{min-width:0;font-size:11px;color:var(--dim2)}
    .blocks{grid-template-columns:1fr;gap:11px}
    .blk .nm{font-size:14px}
    li{font-size:13px}
    .daytag{font-size:10px}
    .nav button,.nav .navlink{padding:5px 9px;font-size:12px}
    .pct{font-size:16px;min-width:50px}
  }
  @media (max-width: 420px){
    h1{font-size:17px}
    .nav button,.nav .navlink{padding:4px 7px;font-size:11px}
    li{font-size:12.5px}
  }
  @media (prefers-reduced-motion:reduce){
    *{transition:none!important;animation:none!important}
    html{scroll-behavior:auto}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="top">
      <h1 id="dateTitle">—</h1>
      <span class="badge" id="phaseBadge">—</span>
      <div class="nav">
        <button id="btnPrev" onclick="shift(-1)">← 前一天</button>
        <button onclick="goToday()">今天</button>
        <button id="btnNext" onclick="shift(1)">后一天 →</button>
        <a href="进度看板.html" target="_blank" rel="noopener" class="navlink">📋 进度看板</a>
      </div>
    </div>
    <div class="meta" id="meta"></div>
    <div class="focus" id="focus"></div>
    <div class="barwrap"><div class="bar"><i id="barfill"></i></div><div class="pct" id="pct">0%</div></div>
  </header>
  <div class="adapt" id="adaptBox" style="display:none"></div>
  <div class="blocks" id="blocks"></div>
  <div class="pkg" id="pkgBox" style="display:none"></div>
  <div class="empty" id="emptyBox" style="display:none"></div>
  <div style="text-align:center;margin-top:14px">
    <button id="previewBtn" onclick="startPreview(nextActiveOffset())" style="display:none;background:#1c232c;color:#e6edf3;border:1px solid #4a5568;border-radius:9px;padding:9px 18px;cursor:pointer;font-size:13px;font-family:inherit">👀 跳到下一个有内容的日子（试勾，不影响正式进度）</button>
  </div>
  <div class="tools">
    <button onclick="saveNow()" title="立刻把当前勾选写进浏览器存储，并显示保存时间">💾 保存进度</button>
    <button onclick="exportProgress()" title="把所有日期的勾选导出成一个 JSON 文件（可以放进工作区备份）">⬇️ 导出备份</button>
    <button onclick="document.getElementById('importFile').click()" title="从之前导出的 JSON 恢复勾选">⬆️ 导入备份</button>
    <button onclick="syncOpen()" title="把勾选存到 GitHub Gist，换设备也能同步">☁️ 云同步</button>
    <button onclick="clearToday()">清空当天勾选</button>
    <button onclick="window.print()">打印今天</button>
    <input type="file" id="importFile" accept=".json,application/json" style="display:none" onchange="importProgress(this)">
    <button onclick="alert('核心规则：\n\n1. 一屏 = 一天。只显示你选的那一天，不再把一周摊开。\n2. 可以回看过去的日子（往前翻到适应周起点），过去的日子标注「已过 · 可补勾」。\n3. 正式周按天拆分：周一~周五各不同 —— 算法 5 道题摊到 5 天、数据结构章节按天推进、AI 每天 1 个动作，周末是收口。\n4. 勾选按日期分别保存（localStorage），切日期不会丢；每次勾选都自动保存。\n5. 想手动确认就点「💾 保存进度」；想换浏览器/清记录前先点「⬇️ 导出备份」。\n6. 每天 0 点后刷新就是新的一天。')">怎么用？</button>
  </div>
    <div class="syncbox" id="syncPanel" style="display:none">
    <div class="synchead">☁️ 云同步 <span id="syncState">未连接</span></div>
    <div id="syncSetup">
      <p class="synctip">换设备也能看到勾选：把进度存进你自己的 GitHub Gist。<br>
        需要一个 token（只勾 <b>gist</b> 权限就够）：
        <a href="https://github.com/settings/tokens/new?scopes=gist&amp;description=study-panel" target="_blank" rel="noopener">点这里创建</a></p>
      <input id="syncToken" type="password" placeholder="粘贴 token（ghp_ 开头或 github_pat_ 开头）" autocomplete="off">
      <button onclick="syncConnect()">连接 / 创建云端备份</button>
    </div>
    <div id="syncOps" style="display:none">
      <button onclick="syncPush()">⬆️ 上传到云</button>
      <button onclick="syncPull()">⬇️ 从云下载</button>
      <button onclick="syncForget()">断开</button>
      <label class="syncauto"><input type="checkbox" id="syncAuto" onchange="syncToggleAuto()"> 自动同步（改完 4 秒后自动上传）</label>
    </div>
    <div id="syncMsg" class="syncmsg"></div>
    <p class="synctip">⚠️ 冲突规则：整体覆盖，最后上传的那份赢。多台设备都勾过时，先想清楚要保哪一份。</p>
  </div>
  <footer id="foot">勾选按「日期」分别保存（localStorage）· 一屏只显示一天 · 每周明细已拆到「天」<br>
    本面板管「今天做什么」；「整个计划」看 <b>进度看板.html</b></footer>
</div>

<script>
/* 任何脚本错误都在页面上显示出来，而不是白屏 —— 不然「勾了不动」根本查不出原因 */
window.onerror = function (msg, src, line, col) {
  var f = document.getElementById("foot");
  if (f) f.innerHTML = '<b style="color:#f85149">面板出错了：</b>' + msg +
    "<br>（位置 " + (src || "?") + ":" + line + ":" + col + "）先按 Ctrl+F5 强制刷新；还不行就看 F12 Console。";
  return false;
};
/* ================================================================
   关键日期
   START      = 2026-10-19（正式第 1 周 · 周一）
   适应周剩余 = 2026-10-15 ~ 10-18（蓝桥杯摸底：这 4 天里做，10-18 定最弱 3 考点）
   规则：早于「今天」的日期一律不再显示
   ================================================================ */
const START      = new Date(2027, 5, 28);
const ADAPT_FROM = new Date(2026, 9, 12);
const ADAPT_TO   = new Date(2026, 9, 18);
const FINAL_FROM = new Date(2026, 11, 1);
/* ⭐ 2026-10-16 改动：期末缓冲延长到 2027-01-24（用户：「1 月 24 号才能确保考试结束」）。
   覆盖 W7 后半 + W8 ~ W14（整整 7 周）。W15（01-25）起恢复正常强度。
   注意：四级考试（2026-12-12，落在 W8）优先于期末缓冲 —— 那一周仍按四级冲刺排。 */
const FINAL_TO   = new Date(2027, 0, 24);

/* 某天概率该看哪一章（按日期往后找最近的一个；超出课程结束后返回 null）
   ⭐ 2026-10-17：拆出 probChapterRaw(d) ——
     ① 缓冲期要用「当天章节」，不能因为处在考期窗口就算成 null（那样期末复习没内容可排）；
     ② 带日期参数，是为了让「本周/全程」统计能按**被统计的那一天**算条目数，
        而不是永远按今天（cur）算 —— 否则缓冲周的总任务数会统计错。 */
function probChapterRaw(d){
  d = d || cur;
  let hit = PROB_PLAN[0];
  for (let i = 0; i < PROB_PLAN.length; i++){
    if (d >= parseDay(PROB_PLAN[i].from)) hit = PROB_PLAN[i];
    else break;
  }
  if (!hit) return null;   /* 2026-10-22：PROB_PLAN 清空后必须判空，否则整块渲染中断 */
  if (hit.until && d > parseDay(hit.until)) return null;   /* 概率期末已过 → 不再显示 */
  return hit;
}
function probNow(){ return probChapterRaw(cur); }

function planHit(plan, d){
  const day = d || cur;
  let hit = plan[0];
  for (let i = 0; i < plan.length; i++) if (day >= parseDay(plan[i].from)) hit = plan[i];
  return hit;
}

function mathItems(dow, d, blockMin){

     ② 2026-11-09 ~ 11-30  高数/线代**提前起跑**（原来 2027-01-25 才开）
     ③ 2026-12-01 ~ 01-24  期末缓冲：一/三/五/日 概率复习 60 · 二/四/六 高数 60（C 计划）
     ④ 2027-01-25 起       寒假每天 80 min → 春季按星期分科；线代 03-02 学完后周二四归高数

  /* ⭐ 2026-10-22（notes/数学-全线规划.md）：2027-06-28 起数学块长按阶段强制，
     不再取模板块的 60/130 —— 模板的数学 min 是给 2026 那一版用的。
       2027.06.28 – 08.31  暑假强化      150 min/天

  const isSummer2728 = (day >= parseDay("2027-06-28") && day <= parseDay("2027-09-05"));

       观看  = R / 1.5（1.5 倍速）

       need  = 观看 + brush  →  这就是当天该给的块时长（由 dayBlocks 读条目 2 得到）
     正则一律用 [0-9] / [.] 写，别用反斜杠转义：那会在 Python 的 u 三引号里触发警告。 */
  const segRaw = (seg) => {
    let sum = 0;
    const re = /（[0-9]+·([0-9]+)min([^）]*)）/g;
    for (const m of String(seg || "").matchAll(re)){
      let dd = Number(m[1]);

         再套 pl.today 模板（{k} 会被替换），超过 cap 就转「收尾」。 */
      const _k = (() => {

        const b = (day instanceof Date) ? day.getTime()

        if (isNaN(a) || isNaN(b)) return 1;
        const kd = Math.max(0, Math.round((b - a) / 86400000));

        let n = 0;
        for (let i = 0; i <= kd; i++){
          const wd = new Date(a + i * 86400000).getDay();
          if (subj === "线代" ? (wd === 0) : (wd >= 1 && wd <= 6)) n++;

        return Math.max(1, n);

    const brush = Math.max(brushAuth, mins - watch);

    out.push("　　视频 " + R + " min（1.5× ≈ " + watch + " min）+ 自己推例题 " + brush + " min" + prog);

  if (day >= CALC_START && day < FINAL_FROM){

    return out;
  }

  /* ④ 2027-01-25 起：寒假 80/天 → 春季按星期分科；线代学完后周二/周四归高数 */
  const calcToday = MATH_SERIAL
    ? (day < LIN_SERIAL_A ? true : (day < LIN_SERIAL_B ? false : dowD !== 0))
    : ((day >= LIN_DONE) ? (dowD !== 0) : (dowD === 1 || dowD === 3 || dowD === 5 || dowD === 6));
  /* ⭐ 2026-10-22：**2027-06-28 起改为单条串行计划**（强化高数→线代→概率→练习），
     每天都有数学，科目由条目的 lec 前缀决定，不再按星期二分高数/线代。
     依据 notes/数学-全线规划.md（实测：强化 36 讲 79.3 h，暑假 150 min/天）。 */
  if (day >= parseDay("2027-06-28")){
    const pl = planHit(CALC_PLAN, day);
    const subj2 = String(pl.lec || "").indexOf("线代") === 0 ? "线代"
                : String(pl.lec || "").indexOf("概率") === 0 ? "概率" : "高数";
    pushSession(pl, subj2, normalMin);
    return out;
  }
  pushSession(planHit(calcToday ? CALC_PLAN : LIN_PLAN, day), calcToday ? "高数" : "线代", normalMin);
  return out;
}

const KEY = d => "dsh-today-" + d;
let cur = new Date(); cur.setHours(0,0,0,0);
const today0 = new Date(); today0.setHours(0,0,0,0);
let state = {};

const fmt = d => d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
const WD  = ["周日","周一","周二","周三","周四","周五","周六"];
const weekIndex = d => Math.floor((d - START) / (DAY * 7));
const isFinal   = d => d >= FINAL_FROM && d <= FINAL_TO;

/* ---- localStorage 容错 ----------------------------------------------------
   隐私模式 / 某些 file:// 或安全策略下，读 localStorage 会直接抛异常。
   原来这里没有 try/catch → loadState() 抛错 → render() 整个中断 → 页面白屏、
   勾选框全部无响应、进度条永远不动。改成本地兜底 + 明确提示。          */
let persistOK = true;
const MEM = {};
function lsGet(k){
  try { return localStorage.getItem(k); } catch(e){ persistOK = false; return (k in MEM) ? MEM[k] : null; }
}
function lsSet(k, v){
  try { localStorage.setItem(k, v); } catch(e){ persistOK = false; MEM[k] = String(v); }
}
const loadState = () => {
  try { state = JSON.parse(lsGet(KEY(fmt(cur))) || "{}") || {}; }
  catch(e){ state = {}; }
  if (typeof state !== "object" || state === null || Array.isArray(state)) state = {};
};
const saveState = () => {
  if (preview) { lsSet(KEY("preview"), JSON.stringify(previewState)); return; }
  lsSet(KEY(fmt(cur)), JSON.stringify(state));
  lsSet(KEY("savedAt"), new Date().toISOString());
  /* 勾完就自动同步（只有开了自动同步才会真的发请求） */
  if (typeof syncTouch === "function") syncTouch();
};

/* ---- 手动保存 / 导出备份 / 导入备份 --------------------------------------
   为什么要这三个：
     panel 默认是「勾一下就自动存」，但它没有任何「保存」按钮 ——
     用户会以为没保存（确实有人这么反馈过）。所以补上：
       保存进度 = 立刻写一次 + 在页脚确认并显示保存时间
       导出备份 = 把所有日期的勾选下载成 progress-YYYY-MM-DD.json
       导入备份 = 从那份 JSON 恢复（换浏览器 / 清过记录后能救回来）        */
function humanTime(iso){
  if (!iso) return "";
  const d = new Date(iso);
  if (isNaN(d.getTime())) return "";
  const p = n => (n < 10 ? "0" + n : "" + n);
  return d.getFullYear() + "-" + p(d.getMonth()+1) + "-" + p(d.getDate()) + " " +
         p(d.getHours()) + ":" + p(d.getMinutes()) + ":" + p(d.getSeconds());
}
function savedAtText(){
  const t = humanTime(lsGet(KEY("savedAt")));
  return t ? "上次保存 " + t : "还没保存过";
}
function saveNow(){
  const NL = String.fromCharCode(10);
  persistOK = true;
  saveState();
  const t = humanTime(lsGet(KEY("savedAt")));
  if (persistOK && t){
    alert(["已保存 ✅", "", "时间：" + t, "这一天：" + fmt(cur),
           "已勾选：" + Object.keys(state).length + " 条", "",
           "（其实你每次勾选都会自动保存，这个按钮只是让你看得见。）"].join(NL));
  } else {
    alert(["保存失败 ❌", "", "本机浏览器禁用了本地存储，勾选只在本次打开期间有效。",
           "解决办法看页面顶部说明，或用「导出备份」把进度存成文件。"].join(NL));
  }
  render();
}
function exportProgress(){
  const NL = String.fromCharCode(10);
  const keys = {};
  try {
    for (let i = 0; i < localStorage.length; i++){
      const k = localStorage.key(i);
      if (k && k.indexOf("dsh-today-") === 0) keys[k] = JSON.parse(localStorage.getItem(k) || "null");
    }
  } catch (e) {
    alert("导出失败：读不到本机存储（" + e.name + "）。" + NL + "本机浏览器可能禁用了本地存储。");
    return;
  }
  const dates = Object.keys(keys).filter(k => k.indexOf("savedAt") < 0 && k.indexOf("preview") < 0);
  const payload = { app: "dsh-today-panel", version: 1, exportedAt: new Date().toISOString(), keys: keys };
  const name = "progress-" + fmt(today0) + ".json";
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = name;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => { try { URL.revokeObjectURL(url); } catch (e) {} }, 2000);
  alert(["已导出备份 ⬇️", "", "文件：" + name,
         "包含日期：" + (dates.length ? dates.map(k => k.replace("dsh-today-", "")).join(", ") : "（还没有任何勾选）"),
         "", "建议把它放到 D:\ai-Study\ 下面留一份。"].join(NL));
}
function importProgress(input){
  const NL = String.fromCharCode(10);
  const f = input && input.files && input.files[0];
  if (!f) return;
  const rd = new FileReader();
  rd.onload = function(){
    let obj = null;
    try { obj = JSON.parse(rd.result); } catch (e) { obj = null; }
    if (!obj || typeof obj !== "object" || !obj.keys || typeof obj.keys !== "object"){
      alert("导入失败：这个文件不是面板导出的备份（应当包含 keys 字段）。");
      input.value = "";
      return;
    }
    let n = 0;
    Object.keys(obj.keys).forEach(function(k){
      if (k.indexOf("dsh-today-") === 0){ lsSet(k, JSON.stringify(obj.keys[k])); n++; }
    });
    alert(["已导入 " + n + " 天的记录 ✅", "导出时间：" + humanTime(obj.exportedAt), "",
           "页面会刷新一下以显示导入结果。"].join(NL));
    input.value = "";
    location.reload();
  };
  rd.onerror = function(){ alert("导入失败：文件读不出来。"); input.value = ""; };
  rd.readAsText(f, "utf-8");
}


/* ---- 云同步：把勾选存进 GitHub Gist ---------------------------------------
   为什么要有：localStorage 按「浏览器 + 域名」隔离，手机、平板、电脑各存一份，
   换设备就看不到彼此的勾选。这里用一个 secret gist 当公共存储。
   安全：token 只存在你自己这台浏览器的 localStorage，不写进这个 HTML。
        这个页面是公开的，但别人打开看不到你的 token，也读不到你的 gist。
   冲突：整体覆盖（最后写的人赢）。想保住某台机器的进度，先「上传」再动手。 */
var SYNC_TOKEN = "dsh-sync-token";
var SYNC_GIST  = "dsh-sync-gist";
var SYNC_AUTO  = "dsh-sync-auto";
var SYNC_LAST  = "dsh-sync-last";
var SYNC_FILE  = "dsh-progress.json";
var SYNC_DESC  = "study-panel progress backup";
var SYNC_API   = "https://api.github.com";
var syncTimer  = null;

function syncCfg(){
  return {
    token: lsGet(SYNC_TOKEN) || "",
    gist:  lsGet(SYNC_GIST)  || "",
    auto:  lsGet(SYNC_AUTO) === "1",
    last:  lsGet(SYNC_LAST)  || ""
  };
}
/* 哪些 localStorage 键参与云同步 —— 面板和「进度看板」必须用同一份规则，
   否则从一边推上去、另一边拉下来就会各丢一半。
     dsh-today-*  每日勾选
     dsh-plan-*   进度看板的勾选（dsh-plan-v3）
   排除：preview（试勾临时数据）、savedAt（纯时间戳，不是 JSON）、
         :fp（看板卡片指纹，必须本机按当前结构自己算，同步过来会误判结构变化） */
function syncWanted(k){
  if (!k) return false;
  if (k.indexOf("preview") >= 0 || k.indexOf("savedAt") >= 0) return false;
  if (k.indexOf(":fp") >= 0) return false;
  return k.indexOf("dsh-today-") === 0 || k.indexOf("dsh-plan-") === 0;
}
/* 收集所有参与同步的键，格式和「导出备份」的 JSON 完全一致 */
function syncCollect(){
  var keys = {};
  try {
    for (var i = 0; i < localStorage.length; i++){
      var k = localStorage.key(i);
      if (syncWanted(k)){
        keys[k] = JSON.parse(localStorage.getItem(k) || "null");
      }
    }
  } catch(e){}
  return { app: "dsh-today-panel", version: 1,
           exportedAt: new Date().toISOString(), keys: keys };
}
function syncApply(payload){
  if (!payload || typeof payload !== "object" || !payload.keys){
    throw new Error("云端数据格式不对");
  }
  var n = 0;
  Object.keys(payload.keys).forEach(function(k){
    if (!syncWanted(k)) return;
    lsSet(k, JSON.stringify(payload.keys[k]));
    n++;
  });
  loadState();
  render();
  return n;
}
function syncMsg(t, bad){
  var el = document.getElementById("syncMsg");
  if (!el) return;
  el.textContent = t;
  el.style.color = bad ? "#f85149" : "#3fb950";
}
function syncUI(){
  var c = syncCfg();
  var setup = document.getElementById("syncSetup");
  var ops   = document.getElementById("syncOps");
  var st    = document.getElementById("syncState");
  var auto  = document.getElementById("syncAuto");
  if (setup) setup.style.display = c.token ? "none" : "";
  if (ops)   ops.style.display   = c.token ? "" : "none";
  if (auto)  auto.checked = !!c.auto;
  if (st){
    st.textContent = c.token
      ? ("已连接" + (c.last ? " · 上次 " + humanTime(c.last) : ""))
      : "未连接";
  }
}
function syncOpen(){
  var p = document.getElementById("syncPanel");
  if (!p) return;
  p.style.display = (p.style.display === "none" || !p.style.display) ? "block" : "none";
  syncUI();
}
function syncReq(method, path, body){
  var c = syncCfg();
  var opt = { method: method, headers: {
    "Authorization": "Bearer " + c.token,
    "Accept": "application/vnd.github+json" } };
  if (body){
    opt.headers["Content-Type"] = "application/json";
    opt.body = JSON.stringify(body);
  }
  return fetch(SYNC_API + path, opt).then(function(r){
    return r.text().then(function(t){
      var j = null;
      try { j = JSON.parse(t); } catch(e){}
      if (!r.ok){
        var m = (j && j.message) ? j.message : ("HTTP " + r.status);
        throw new Error(m);
      }
      return j;
    });
  });
}
function syncGistBody(){
  var payload = syncCollect();
  var files = {};
  files[SYNC_FILE] = { content: JSON.stringify(payload, null, 2) };
  return { files: files };
}
/* 连接时先找账号里「已有的」那份备份 —— 换设备时最怕的就是又新建一份空的，
   结果旧数据拉不回来。只有确实没有旧备份，才用本机数据新建。 */
function syncConnect(){
  var inp = document.getElementById("syncToken");
  var tok = String((inp && inp.value) || "").trim();
  if (!tok){ syncMsg("先粘贴 token", true); return; }
  lsSet(SYNC_TOKEN, tok);
  syncMsg("正在验证 token …");
  syncReq("GET", "/user").then(function(u){
    syncMsg("已登录：" + u.login + "，正在查找已有的云端备份 …");
    return syncReq("GET", "/gists?per_page=100").then(function(list){
      return { login: u.login, list: list };
    });
  }).then(function(r){
    var found = null;
    (r.list || []).forEach(function(g){
      if (found || !g) return;
      if (g.description === SYNC_DESC && g.files && g.files[SYNC_FILE]) found = g;
    });
    if (found){
      /* 接上旧备份：只记 id，不上传（本机可能是空的，传上去就把云端抹了） */
      lsSet(SYNC_GIST, found.id);
      lsSet(SYNC_LAST, new Date().toISOString());
      syncMsg("已接上你以前的云端备份 ✅ 点「⬇️ 从云下载」把勾选拉回来（先别上传，会把云端覆盖成空）");
      syncUI();
      return null;
    }
    syncMsg("没有找到旧的备份，正在创建第一份 …");
    return syncReq("POST", "/gists", {
      description: SYNC_DESC,
      public: false,
      files: syncGistBody().files
    }).then(function(g){
      lsSet(SYNC_GIST, g.id);
      lsSet(SYNC_LAST, new Date().toISOString());
      syncMsg("连接成功，已创建云端备份 ✅");
      syncUI();
    });
  })["catch"](function(e){
    lsSet(SYNC_TOKEN, "");
    syncMsg("连接失败：" + e.message, true);
    syncUI();
  });
}
function syncPush(silent){
  var c = syncCfg();
  if (!c.token || !c.gist){
    if (!silent) syncMsg("还没连接", true);
    return Promise.resolve(false);
  }
  if (!silent) syncMsg("正在上传 …");
  return syncReq("PATCH", "/gists/" + c.gist, syncGistBody()).then(function(){
    lsSet(SYNC_LAST, new Date().toISOString());
    if (!silent) syncMsg("已上传 ✅");
    syncUI();
    return true;
  })["catch"](function(e){
    if (!silent) syncMsg("上传失败：" + e.message, true);
    return false;
  });
}
function syncPull(){
  var c = syncCfg();
  if (!c.token || !c.gist){ syncMsg("还没连接", true); return; }
  syncMsg("正在下载 …");
  syncReq("GET", "/gists/" + c.gist).then(function(g){
    var f = g.files && g.files[SYNC_FILE];
    if (!f) throw new Error("云端没有 " + SYNC_FILE);
    var payload = JSON.parse(f.content);
    var n = syncApply(payload);
    lsSet(SYNC_LAST, new Date().toISOString());
    syncMsg("已下载并覆盖本地：" + n + " 天记录 ✅");
    syncUI();
  })["catch"](function(e){
    syncMsg("下载失败：" + e.message, true);
  });
}
function syncToggleAuto(){
  var el = document.getElementById("syncAuto");
  lsSet(SYNC_AUTO, (el && el.checked) ? "1" : "0");
}
/* 每次勾选后调用：开了自动同步就防抖 4 秒推一次 */
function syncTouch(){
  var c = syncCfg();
  if (!c.auto || !c.token || !c.gist) return;
  if (syncTimer) clearTimeout(syncTimer);
  syncTimer = setTimeout(function(){ syncPush(true); }, 4000);
}
function syncForget(){
  if (!confirm("断开云同步？本机勾选不会丢，只是不再和云端同步。")) return;
  lsSet(SYNC_TOKEN, ""); lsSet(SYNC_GIST, ""); lsSet(SYNC_AUTO, "0");
  syncMsg("已断开");
  syncUI();
}

/* ⭐ 2026-10-17 新增：408 小块的名字跟着**实际内容**走。
   背景（用户指出）：块名一直硬编码「数据结构」，但 408 这条线在 36 周里跨四门 ——
     ⭐ 2026-10-17 重排：数据结构 W1–W14 → 组成原理 W15–W22 → 操作系统 W23–W30 → 网络 W31–W35 → 四门串联 W36
   → 于是 W15 出现「数据结构 / 1h / 组成原理：CPU 与流水线」这种自相矛盾的显示。
   判定规则（按显式标记计分，取最高分；两类都明显出现 → 显示「408（A + B）」）：
   - 有「408 串联 / 四门」→ 408（四门串联）
   - 否则按 【OS】/【网络】/组成原理/王道等内容词计分
   - 期末缓冲周（fin）在后面统一加「（期末复习）」后缀 */
const SUBJ_ORDER = ["数据结构", "组成原理", "操作系统", "计算机网络"];
const SUBJ_RE = {
  "数据结构":   /王道|数据结构|线性表|链表|KMP|二叉树|哈夫曼|并查集|邻接矩阵|邻接表|MST|最短路|拓扑|关键路径|折半|BST|AVL|散列|ASL|快排|堆排|归并排序|败者树/g,
  "组成原理":   /组成原理|组原|Cache|流水线|指令系统|数据通路|微程序|总线|DMA|IEEE|浮点|补码|原码|移码|存储系统|主存|SRAM|DRAM|TLB|虚拟存储|RAID|CPU|冯诺依曼|寻址|CISC|RISC|CPI|MIPS|溢出判断|扩展操作码/g,
  "操作系统":   /【OS】|操作系统/g,
  "计算机网络": /【网络】|计算机网络/g,
};
function dsSubject(w){
  /* ⭐ 2026-10-17：每周显式声明 subj（见 WEEKS 的 dict(subj=...)），不再靠关键词猜 ——
     关键词法一旦遇到「王道」这种四门共用的书名就会判错（组成原理周被判成数据结构）。 */
  if (w && w.subj) return w.subj;
  /* ⭐ 2026-10-17：「王道」是四门共用的书名（王道 3.1 栈 / 王道 3.1 存储层次 / 王道 2.1 进程 …），
     不剥掉就会把 OS、网络、组成原理的周全算成「数据结构」。判科前先去掉书名。 */
  const text = ((w && w.ds) || []).map(x => x.t).join(" ").replace(/王道/g, " ");
  if (/408 串联|把四门|四门串联/.test(text)) return "408（四门串联）";
  const score = {};
  SUBJ_ORDER.forEach(n => { score[n] = (text.match(SUBJ_RE[n]) || []).length; });
  const ranked = SUBJ_ORDER.slice().sort((a, b) => score[b] - score[a]);
  const top = score[ranked[0]], second = score[ranked[1]];
  if (top === 0) return "408";
  /* 次高分 ≥ 最高分的一半 → 这周确实在跨科目（如 W28 OS 二轮 + 网络起步）；
     只把「同样占分」的科目列进去，避免个别书目名（如「王道」）被算成一门。 */
  if (second > 0 && second * 2 >= top)
    return "408（" + ranked.filter(n => score[n] * 2 >= top).join(" + ") + "）";
  return ranked[0];
}
/* ⭐ 2026-10-18：摘要区「英语材料」那一行的标签原来**写死「听力」**，
   但 en[0] 的含义随阶段变：四级期是听力真题、考研期是「红宝书 / 英一阅读」。

   改成按材料内容判标签。 */
function enMatLabel(t){
  const s = String(t || "");
  if (/听力|六级听力/.test(s)) return "听力";
  /* 「2023.12 第 3 套」这种就是四级真题套 → 默认当听力（四级阶段每天听一套） */
  if (/^20\d\d\.\d+\s*第\s*\d\s*套$/.test(s)) return "听力";
  if (/红宝书|单词|词汇/.test(s)) return "单词";
  if (/阅读|精读|真题|完型|翻译|作文|模拟|考试/.test(s)) return "阅读";
  return "材料";
}

function dsLabel(w, fin){
  const s = dsSubject(w);
  if (!fin) return s;
  /* ⭐ 2026-10-21 用户口径：期末窗口里排的组成原理是**新章推进**（王道 3.x 起），
     不是复习学校已开的课 —— 所以块名就叫「组成原理」，不加「（期末复习）」后缀。
     数据结构那几周确实是复习，后缀保留。 */
  if (s === "组成原理") return s;
  return (s === "408") ? "408（期末复习）" : s + "（期末复习）";
}
/* ⭐ 2026-10-18：W11/W12 的周日多一条「🔜 组成原理提前启动」，但块名整周都是
   「数据结构（期末复习）」→ 周日出现「块名说数据结构、内容是组成原理」。
   块名改成**按当天条目**判定：当天有跨科条目就把那一科标出来。 */
function dsLabelFor(items, w, fin, d){
  /* ⭐ 408 现在按 B 站真实时长排（WD_MAP），科目不再跟周次走。
     所以块名必须看「当天学的是哪一门」，否则会出现「块名写组成原理、内容是操作系统」。 */
  if (typeof WD_MAP !== "undefined" && d){
    const ids = WD_MAP[fmt(d)];
    if (ids && ids.length){
      const subs = {};
      ids.forEach(function(i){ subs[WD_UNITS[i].s] = 1; });
      const ks = Object.keys(subs);
      if (ks.length) return ks.join(" + ");
    }
    if (!isFinal(d)){
      /* 基础轮之后是真题轮；基础轮之中没排到单元的日子只是复习 */
      return (fmt(d) > wdLastDate()) ? "408真题" : "408 真题/复习";
    }
  }
  const base = dsLabel(w, fin);
  const txt = (items || []).map(x => String(x)).join(" ");
  const extra = [];
  if (/组成原理提前启动/.test(txt)) extra.push("组成原理（预备）");
  if (!extra.length) return base;
  return base.replace("（期末复习）", "") + " + " + extra.join(" + ");
}

/* 「本周概览」里 408 那行：也要按 WD_MAP 汇总，不能再用旧的 w.ds
   （否则会出现「概览写王道 3.1 栈、下面是王道 1.1」这种自相矛盾）。 */
function dsWeekItems(){
  const wi2 = weekIndex(cur);
  const start = new Date(START.getTime() + wi2 * 7 * DAY);
  const out = [];
  for (let i = 0; i < 7; i++){
    const dd = new Date(start.getTime() + i * DAY);
    const ids = (typeof WD_MAP !== "undefined") ? WD_MAP[fmt(dd)] : null;
    if (ids) ids.forEach(function(j){
      const u = WD_UNITS[j];
      out.push({ t: "王道 " + u.c + " " + u.t });
    });
  }
  if (!out.length){
    const w2 = WEEKS[Math.max(0, Math.min(wi2, WEEKS.length - 1))] || {};
    return (w2.ds || []);
  }
  return out;
}

   但缓冲期 C 计划是「一/三/五/日 概率 · 二/四/六 高数」——
   于是周二/周四/周六会出现「块名说概率、内容是高数」的自相矛盾（36 周里 24 次）。
   和 408 的 dsLabelFor 同样的做法：块名按当天条目判定。 */
function mathLabelFor(items, base){
  if (!/期末复习/.test(base)) return base;        /* 只有缓冲期模板的块名需要改 */
  const t = (items || []).join(" ");
  const hasP = /概率|随机变量|数理统计|分布列|期望|方差|大数定律/.test(t);
  const hasG = /高数|极限|微分|中值|积分|级数|多元|重积分|曲面/.test(t);
  const hasX = /线代|向量组|特征值|相似|二次型|矩阵|行列式/.test(t);
  if (hasP && !hasG && !hasX) return "数学（概率期末复习）";
  if (hasG && !hasP && !hasX) return "数学（高数·期末复习）";
  if (hasX && !hasP && !hasG) return "数学（线代·期末复习）";
  if (hasG || hasX) return "数学（高数/线代·期末复习）";

}

                       4:"Section A 短篇新闻 1 段", 5:"Section B 长对话 1 段"}[dow] || "Section A 短篇新闻 1 段";
          out.push(wordLine(20));
          out.push("四级听力单篇 25 min：做题 3 → 精听 17 → 跟读 5 ｜今天听 " + mat + " 的 " + sec);
          out.push("四级阅读 15 min：1 篇真题（只做不精读，周末统一看）");
        } else if (stage === "post"){
          out.push(wordLine(20));
          out.push("阅读精读 30 min：" + readMatF + "（先做题 → 逐句拆 → 生词进本）");
          out.push("长难句 10 min：从今天这篇里挑 1 句，划成分 + 翻译");
        } else {
          out.push(wordLine(20));
          out.push("阅读精读 30 min：" + readMatF + "（先做题 → 逐句拆 → 生词进本；期末期听力暂停）");
          out.push("六级专项 10 min：" + (enMatF[3] || "翻译 / 写作 1 段"));
        }
      } else {
        if (stage === "cet4"){
          out.push(wordLine(25));
          if (dow === 6){
            out.push("整套限时 30 min：四级听力 1 套（25 min 不停不回头）+ 对答案 5 min");
          } else {
            out.push("听力错段精听 15 min：周六那套里错的 2 段，各 7 min（只复听、不追新题）");
            out.push("长难句 20 min：刘晓艳《不就是语法和长难句吗？》（抄句 → 划成分 → 翻译 2 句）");
          }
        } else if (stage === "post"){
          out.push(wordLine(25));
          out.push("长难句 35 min：刘晓艳《不就是语法和长难句吗？》（抄句 → 划成分 → 翻译 → 对答案）");
          /* 期末缓冲的周六原来只有 5 条（低于 6 条下限），补一条能当天做完的 */
          if (dow === 6) out.push("生词本清空 + 本周错词过一遍 15 min（读出声，不抄写法）");
        } else {
          out.push(wordLine(25));
          out.push("长难句 25 min：刘晓艳《不就是语法和长难句吗？》（划成分 + 翻译 2 句）");
          out.push("六级专项 10 min：" + (enMatF[3] || "翻译 / 写作 1 段"));
        }
      }
      return out;
    }

    if (isWeekend){
      if (stage === "cet6"){
        out.push("单词 30 min：红宝书 " + redBook(d) + "（六级词汇已含在内）");
      } else {
        out.push("单词 30 min：" + wordTag(stage, d));
      }
      /* ⭐ 2026-10-18 用户指出「一套听力要 25 min」—— 工作日 30 min 只够做**单篇**，
         整套限时必须放周末（周六 30 min 四级 / 40 min 六级），周日只复盘错段。 */
      const satList = (stage === "cet4");
      const sat6 = (stage === "cet6" && en6RealListening(w));
      const isSat = (dow === 6);
      const bigListen = isSat && (satList || sat6);   /* 周六才有整套限时，长难句让 10 min */
      if (dow === 6 && satList)
        out.push("⭐ 整套限时 30 min：四级听力 1 套" + (pool[3] ? "（" + pool[3] + "）" : "")
               + "（25 min 不停不回头）+ 对答案 5 min（不做精听，精听留周日）");
      if (dow === 6 && sat6)
        out.push("⭐ 整套限时 40 min：六级听力 1 套（30 min，讲座题先记 5 个关键词）+ 对答案 10 min");
      if (dow === 0 && satList)
        out.push("听力错段精听 15 min：周六那套里错的 2 段，各 7 min（只复听、不追新题）");
      if (dow === 0 && sat6)
        out.push("听力错段精听 15 min：周六那套里错得最多的 2 段（讲座题优先）");
      const lsK = lsNo(d);
      if (lsK >= 1 && lsK <= LS_DUR.length){
        const lv = LS_DUR[lsK - 1];
        out.push("⭐ 长难句 " + (bigListen ? "40" : "50") + " min：刘晓艳语法长难句 第 " + lsK + "/" + LS_DUR.length + " 讲"
               + "「" + LS_TITLE[lsK - 1] + "」（本讲 " + lv + " min，1.5× ≈ " + Math.round(lv / 1.5)
               + " min）→ 抄句 → 划成分 → 翻译 → 对答案");
      } else {
        /* ⭐ 2026-10-19：长难句讲完后，周末英语块会空出 40–50 min（块 102、条目只有 50–60）。
           按剩余时间补真实任务，不再留占位句。 */
        let used = 0;
        out.forEach(x => { const mm = String(x).match(/([0-9]+) min/); if (mm) used += Number(mm[1]); });
        /* 六级阶段后面还会 push 一条 20 min 专项，这里先预留，否则会超块 */
        const reserve = (stage === "cet6") ? 20 : 0;
        const gap = Math.max(0, (b.min || 100) - used - reserve);
        if (gap >= 25){
          const readMin = Math.min(45, gap);
          const nm2 = stage === "cet6" ? "六级阅读" : stage === "cet4" ? "四级阅读" : "英一阅读";
          out.push(nm2 + " " + readMin + " min：真题 1 篇限时 " + (readMin - 15) + " min + 订正 15 min（长难句讲完后的补位）");
        } else if (gap >= 10){
          out.push("复盘 " + gap + " min：本周错题 + 生词本清空");
        }
      }
      if (stage === "cet6")
        out.push("考研英语专项 20 min：" + (isSat
          ? "六级翻译 / 写作 1 篇（听力已在整套里做过，专项不重复听）"
          : "六级真题（听力 1 篇 / 阅读 1 篇 轮换，严格计时）"));
      return out;
    }
    if (stage === "cet6"){
      /* enMaterial 四条的含义随阶段变：
         六级阶段 [六级听力?, 英一阅读Text1, 英一阅读Text2, 六级翻译/写作]
         → 听力取 en[0]（**只有它真是听力材料时**），阅读取 en[1..2]，专项取 en[3]。
         ⚠️ 2026-10-18 修：W14–W22 的 en[0] 还不是六级听力真题（那几周是「真题阅读起步」），
         原来一律当听力 → 出现「六级听力 30 min：真题阅读起步：每天 1 篇精读」这种标签错位，
         9 周共 63 条、约 31.5 h 名不副实。现在：材料不像听力就不排听力条目，
         那 30 min 直接并进英一阅读（听力只集中在 W1–W8 四级 + W23 起真六级真题）。*/
      const enMat = (w && w.enMaterial) || [];
      const listenMat = enMat[0] || "";
      const realListen = /听力/.test(listenMat);
      const readMat = enMat[1 + Math.min(Math.max(dow - 1, 0), 1)] || "英一真题精读";
      out.push("单词 25 min：红宝书 " + redBook(d) + "（考研 5500 词已含六级词汇，六级词书不再单背）");
      if (realListen){
        /* 工作日只做**单篇**（一套 30 min 装不进 30 min 的块里）：
           section 按星期轮换，避免天天只听同一种题型 */
        const secMap = {1:"Section A 长对话 1 段", 2:"Section B 听力篇章 1 段",
                        3:"Section C 讲座 1 篇", 4:"Section A 长对话 1 段", 5:"Section C 讲座 1 篇"};
        out.push("六级听力单篇 30 min：做题 4 → 精听 20 → 跟读 6 ｜今天听 " + listenMat + " 的 " + (secMap[dow] || "Section C 讲座 1 篇"));
        out.push("阅读 20 min：" + readMat);
      } else {
        out.push("阅读精读 50 min：" + readMat + "（先做题 → 逐句拆 → 生词进本；听力从 W23 才起，这里全给阅读）");
      }
      out.push("考研英语专项 20 min：" + (enMat[3] || "翻译 / 写作 轮换（六级独有题型）"));
    } else if (stage === "post"){
      /* W9–W13：四级已考完。enMaterial = [总述, 阅读Text1, 阅读Text2, 复盘]
         → 不再当听力材料用；改成「红宝书 + 英一阅读精读」。 */
      const enMat = (w && w.enMaterial) || [];
      const readMat = enMat[1 + Math.min(Math.max(dow - 1, 0), 1)] || enMat[0] || "英一真题精读";
      out.push("单词 30 min：考研红宝书" + wordProg2("post", wi));
      out.push("阅读精读 50 min：" + readMat + "（先做题 → 逐句拆 → 生词进本）");
      out.push("长难句 20 min：从今天这篇里挑 2 句，划成分 + 翻译");
    } else {
      /* ⭐ 2026-10-18 用户指出：一套听力 25 min，30 min 的块装不下「做题 + 精听 + 跟读」。
         所以工作日只做**单篇**（1 段音频 2–3 min），整套留到周六限时。
         分钟必须对得上：4 + 20 + 6 = 30。 */
      const secMap = {1:"Section A 短篇新闻 1 段", 2:"Section B 长对话 1 段",
                      3:"Section C 听力篇章 1 段", 4:"Section A 短篇新闻 1 段", 5:"Section B 长对话 1 段"};
      /* ⚠️ W5–W8 的 w.en 存的是冲刺任务名（"⚠️ 四级冲刺：写作模板开始背"），
         直接当听力材料会渲染出「今天听 ⚠️ 四级冲刺：写作模板开始背 的 Section A」。
         只接受「YYYY.M 第 N 套」这种真套号，否则回退成通用材料名。 */
      const raw4 = pool[dow-1] || pool[0] || "";
      const mat4 = /^20\d\d\.\d+ 第 \d+ 套$/.test(raw4) ? raw4 : "四级听力真题（本周还没精听的那一套）";
      out.push("四级听力单篇 30 min：做题 4 → 精听 20 → 跟读 6 ｜今天听 " + mat4 + " 的 " + (secMap[dow] || "Section A 短篇新闻 1 段"));
      out.push("单词 30 min：" + wordTag("cet4", d));
      out.push("阅读真题 20 min（四级阅读）");
    }
  } else if (b.src === "ds"){
    /* 周四、周五各有 2h 数据结构课（**仅 2027-01-24 前课表已知**）。三种情况要分开说，
       否则「块只有 60 min」和「课上 2h」会自相矛盾：
       - 平时：块 180 min = 课上 120 + 自习 60 → 标「【课上 2h】」（内容当场做完，不占课下）
       - 期末缓冲：块只有 60 min 自习，课上 2h **不在这块里** → 标「【课上 2h 另算】」
       - 01-24 之后：课表不确定、不再假设有课 → 不加任何前缀（块 180 min 全是自习） */
    const hasClass = (dow === 4 || dow === 5) && d <= CLASS_KNOWN_TO;
    const tag = !hasClass ? "" : (isFinal(d) ? "【课上 2h 另算】" : "【课上 2h】");
    /* ⭐ 2026-10-19 用户要求：408 按 B 站王道官方课的真实时长排。
       WD_MAP[日期] = 当天要学的单元下标数组；每个单元带 视频分钟 / 观看分钟 / 课后题分钟。
       条目直接把三件事写清楚：看哪一节、看多久、刷多久 —— 不再出现「40 分钟的课占 2 小时」。 */
    const ids = (typeof WD_MAP !== "undefined" && d) ? (WD_MAP[fmt(d)] || null) : null;
    if (ids && ids.length){
      ids.forEach(function(i){
        const u = WD_UNITS[i];
        out.push(tag + "王道 " + u.c + " " + u.t + "：视频 " + u.v + " min（1.5× ≈ " + u.w
          + " min）+ 课后题 约 " + u.e + " min");
      });
      return out;
    }
    /* 没有新内容的日子 = 真题/复习轮（内容在 WD 表里已经排完，不再重复讲旧内容）。
       期末缓冲期（12-01~01-24）保留原「期末复习」文本，那是有意义的。 */
    if (isFinal(d)){
      pick(w && w.ds, dow).forEach(x => out.push(tag + x));
      return out;
    }
    const DS_REVIEW = [
      "真题选择题 20 道（限时 12 min）+ 错题回看（约 45 min）",
      "真题大题 1 道（先自己想 20 min 再看答案）+ 重做昨天错的（约 60 min）",
      "本章错题重做 + 二刷笔记（约 45 min）",
      "真题一套的选择填空部分（限时 30 min）+ 订正（约 30 min）",
      "四门轮转：本周最弱的那个科目补一章错题（约 50 min）",
      "错题本清一遍 + 画一张本章知识框架（约 40 min）",
      "真题大题 2 道（每天限时 25 min 一道）+ 对答案（约 60 min）",
    ];
    /* 原文里已经是「真题/复习/二轮/模拟」的日子保留原文（W27+ 的年份真题清单不能丢） */
    const orig = pick(w && w.ds, dow) || [];
    /* 旧文本（年份真题 / 二轮）只在「期末缓冲」或「基础轮走完之后」保留；
       否则会出现「网络二轮②」排在一轮还没学完的时候。 */
    const afterBase = isFinal(d) || (!!d && fmt(d) > wdLastDate());
    if (afterBase && orig.some(x => /真题|复习|二轮|模拟|串讲|考期|强化|大题/.test(String(x)))){
      orig.forEach(x => out.push(tag + x));
      return out;
    }
    out.push(tag + "408 真题/复习：" + DS_REVIEW[dow]);
    return out;
  } else if (b.src === "algo"){
    /* 算法块的分钟数要能对上题量：写明「看/学 → 自己推 → 计时手写」。
       一天有多条时只有第一条承担分配，其余的扣掉其已声明分钟，避免重复计算。 */
    const alM = b.min || 120;
    const alItems = pick(w && w.algo, dow);
    let other = 0;
    alItems.slice(1).forEach(function(x){
      const mm = String(x).match(/([0-9]+) ?min/);
      if (mm) other += Number(mm[1]);
    });
    const lead = Math.max(20, alM - other);
    const g1 = Math.round(lead * 0.3), g2 = Math.round(lead * 0.5), g3 = lead - g1 - g2;
    alItems.forEach(function(x, i){
      if (i > 0){ out.push(x); return; }
      out.push(x + "（这块 " + lead + " min：看/学 " + g1 + " → 自己推 " + g2
        + "（不看模板写出来）→ 计时手写 " + g3 + "（复现一遍再对拍））");
    });
  } else if (b.src === "ai"){
    /* 一条 AI 任务要撑起整块时间：写清「学 / 练 / 记」各多少分钟，
       否则 60 min 块配一句「各写一个小程序」，等于又回到「时间超过内容」。 */
    const aiM = b.min || 30;
    const a1 = Math.round(aiM * 0.35), a2 = Math.round(aiM * 0.5), a3 = aiM - a1 - a2;
    pick(aiOf(w, wi), dow).forEach(x => out.push(x
      + "（今天就这块 " + aiM + " min：学 " + a1 + " → 自己写 " + a2 + "（能跑、改 3 个参数看结果）→ 记 " + a3 + "（3 行笔记：会了/卡点/明天先做））"));
  } else if (b.src === "math"){
    mathItems(dow, d, b.min).forEach(x => out.push(x));
  }
  (b.extra || []).forEach(x => out.push(x));
  return out;
}

/* 某一天每个块最终显示哪些条目（渲染和统计共用这一份，避免两处算法不一致）
   注意：bi 必须是「过滤后可见块的序号」，跟渲染时 box.appendChild 的先后一致；
   不能直接用模板下标 —— 有的天某个块没任务会被跳过，那样 key 就整体错位。 */
/* ⭐ 数学块该给多少分钟：直接从条目 2 读回来（视频观看 + 纸上刷题），
   这样「块时长」和「条目里写的时长」永远出自同一处，不会再出现写 130 块给 60 的情况。 */
function mathNeedOf(items){
  for (let i = 0; i < (items || []).length; i++){
    const m = String(items[i]).match(/视频 ([0-9]+) min（1[.]5× ≈ ([0-9]+) min）[+] 纸上刷题 ([0-9]+) min/);
    if (m) return Number(m[2]) + Number(m[3]);
  }
  return 0;
}

/* 基础轮最后一天（WD_MAP 里最大的日期）。之后才是真题/二轮轮次 */
function wdLastDate(){
  if (typeof WD_MAP === "undefined") return "";
  const ks = Object.keys(WD_MAP).sort();
  return ks.length ? ks[ks.length - 1] : "";
}

/* 当天 408 单元一共多少分钟（按 WD_MAP 的日期 → 单元下标查表） */
/* 考试日：当天不排会冲突的线
   省赛 2027-04-10：竞赛当天砍 数学 / AI（数学是 161 min 的硬仗，AI 也不该挤占）
   六级 2027-06-19：英语当天就是考试，砍 数学 / 算法（算法 170 min 是最大的一块） */
function examDrop(d, src){
  if (!d) return false;
  const m = fmt(d);
  if (m === "2026-12-12") return src === "math" || src === "ai";   /* 四级考试日下午 */
  if (m === "2027-04-10") return src === "math" || src === "ai";
  if (m === "2027-06-19") return src === "math" || src === "algo";
  return false;
}

function wdNeedOf(d){
  if (typeof WD_MAP === "undefined" || !d) return 0;
  const ids = WD_MAP[fmt(d)];
  if (!ids || !ids.length) return 0;
  let t = 0;
  ids.forEach(function(i){ t += (WD_UNITS[i] || {}).b || 0; });
  return t;
}

/* 单日上限 9.6 h：模板叠起来超过就先从 AI 块扣（AI 最可让），再扣算法。
   2027-01-29（寒假最后一晚）实测 10.1 h，就是被这里压回 9.6 的。 */
function capTemplate(tpl, d){
  if (!d) return tpl;
  const CAP = 576;                       /* 9.6 h */
  /* 模板层不做裁剪：模板 9.0 h 的日子实际可能是 10.1 h，
     真正的裁剪在 dayBlocks 末尾按「真实块时长」做。 */
  return tpl;
  const cp = tpl.map(b => Object.assign({}, b));
  [["ai", 30], ["algo", 60]].forEach(function(p){
    if (over <= 0) return;
    const b = cp.filter(x => x.src === p[0])[0];
    if (!b) return;
    const cut = Math.min(over, Math.max(0, b.min - p[1]));
    b.min -= cut; over -= cut;
  });
  return cp;
}

function dayBlocks(dow, w, adapting, fin, wi, d){
  /* ⭐⭐ 弹性日（每月第 4 个周日）直接替换当天全部内容：3 块共 3 h。 */
  if (!adapting && isFlexDay(d)) return flexBlocks();
  let tpl = (adapting ? adaptTemplate() : weekdayTemplate(dow, fin, d));
  if (!adapting) tpl = capTemplate(tpl, d);
  const out = [];
  tpl.forEach((b) => {
    const items = adapting ? b.items : buildItems(b, w, dow, wi, d);
    if (!adapting && !b.fixed && items.length === 0) return;   // 今天这块没任务 → 不显示
    /* ⭐ 408 块名跟着本周内容走（数据结构 / 组成原理 / 操作系统 / 计算机网络 / 408） */
    const nm = (b.src === "ds") ? dsLabelFor(items, w, fin, d)
             : (b.src === "math") ? mathLabelFor(items, b.nm) : b.nm;
    /* ⭐ 方案 B：数学块按条目里的真实时长给（只加不减，其它块不受影响） */
    const need = (!adapting && b.src === "math") ? mathNeedOf(items) : 0;
    /* 408：块时长 = 当天单元的真实块分钟（视频/1.5 + 课后题），装进模板额度里 */
    /* 考试日：冲突的线当天直接不排（块消失），腾出来的时间就是休息 */

/* 统计某一天会用到的 key（必须与渲染完全一致）
   ⭐ 2026-10-17：加 d（那一天的日期）—— 数学块在缓冲期是 2 条、非缓冲期是 1~2 条，
     原来按「今天」算，会让缓冲周的「本周/全程」总数统计错。 */
/* 勾选键 = 条目文字的哈希（djb2）。原来用「块序:条序」，一旦改条目就会让旧勾
   错位到别的任务上 —— 错位比丢失更糟，所以改成按内容认。
   同一天同一段文字出现两次时，第二个加 -2 后缀。 */
function itemKey(text, seen){
  const str = String(text);
  let h = 5381;
  for (let i = 0; i < str.length; i++) h = ((h << 5) + h + str.charCodeAt(i)) | 0;
  const k = (h >>> 0).toString(36);
  seen[k] = (seen[k] || 0) + 1;
  return seen[k] > 1 ? k + "-" + seen[k] : k;
}

const pkgStates = {};
let pkgActive = null;
function pkgKey(tag){ return "dsh-pkg-" + tag + "-v1"; }
function pkgState(tag){
  if (pkgStates[tag]) return pkgStates[tag];
  let o = {};
  try { o = JSON.parse(lsGet(pkgKey(tag)) || "{}") || {}; } catch(e){ o = {}; }
  if (typeof o !== "object" || o === null) o = {};
  pkgStates[tag] = o;
  return o;
}
function pkgWindow(){
  for (let i = 0; i < PKG_WINDOWS.length; i++){
    const w = PKG_WINDOWS[i];
    if (cur >= parseDay(w.from) && cur <= parseDay(w.to)) return w;
  }
  /* ⭐ 2026-10-20：窗口过了但东西没买齐 → 继续显示，直到买齐或下一个窗口开始。
     原来的行为是 10-25 一过 W1 卡就消失，那 8 条书没到也没人提醒（用户指出）。
     只对 hold:true 的窗口生效，考前清单那种有明确截止的不用 hold。 */
  for (let i = 0; i < PKG_WINDOWS.length; i++){
    const w = PKG_WINDOWS[i];
    if (!w.hold) continue;
    if (cur <= parseDay(w.to)) continue;
    const st = pkgState(w.tag);
    const left = w.items.filter(x => x.pre ? (st[x.k] === false) : !st[x.k]).length;
    if (left === 0) continue;                 /* 买齐了就收起 */
    const nxt = PKG_WINDOWS[i + 1];
    if (nxt && cur >= parseDay(nxt.from)) continue;   /* 下一批开始了，让位 */
    return w;
  }
  return null;
}
function pkgToggle(k){
  if (!pkgActive) return;
  const st = pkgState(pkgActive.tag);
  if (st[k]) delete st[k]; else st[k] = 1;
  try { lsSet(pkgKey(pkgActive.tag), JSON.stringify(st)); } catch(e){}
  const box = document.getElementById("pkgBox");
  if (!box) return;
  /* 原地更新，不重建整张卡：重建会把手里的 input 变成游离节点 */
  box.querySelectorAll(".row").forEach(r => {
    const inp = r.querySelector("input");
    if (!inp) return;
    const on = !!st[inp.getAttribute("data-k")];
    inp.checked = on;
    if (on) r.classList.add("done"); else r.classList.remove("done");
  });
  const items = pkgActive.items;
  const leftN = items.filter(x => !st[x.k]).length;
  const cnt = box.querySelector(".cnt2");
  if (cnt) cnt.textContent = (items.length - leftN) + "/" + items.length;
  const bar = box.querySelector(".bar2 > i");
  if (bar) bar.style.width = Math.round((items.length - leftN) / items.length * 100) + "%";
  if (leftN === 0){ box.style.display = "none"; box.innerHTML = ""; pkgActive = null; }
}
function renderPkg(){
  const box = document.getElementById("pkgBox");
  if (!box) return;
  const w = pkgWindow();
  if (!w){
    box.style.display = "none"; box.innerHTML = ""; pkgActive = null; return;
  }
  const st = pkgState(w.tag);
  /* pre:1 = 计划里已经做完的事（视频来源已确认、库已装好）。
     默认算完成，但用户手动点掉仍以用户为准（st[x.k] === false）。 */
  const doneOf = x => x.pre ? (st[x.k] !== false) : !!st[x.k];
  const leftN = w.items.filter(x => !doneOf(x)).length;
  if (leftN === 0){   /* 这批买齐了 → 收起，不占视线 */
    box.style.display = "none"; box.innerHTML = ""; pkgActive = null; return;
  }
  pkgActive = w;
  box.style.display = "block";
  const doneN = w.items.length - leftN;
  let h = "<h2>" + w.title +
          '<span class="cnt2">' + doneN + "/" + w.items.length + "</span>" +
          '<span style="font-size:12px;font-weight:400;color:#9aa7b4">' + w.note + "</span></h2>" +
          '<div class="sub">' + w.sub + "</div>";
  w.items.forEach(x => {
    const on = doneOf(x);
    h += '<div class="row' + (on ? " done" : "") + '">' +
         '<input type="checkbox" data-k="' + x.k + '"' + (on ? ' checked="checked"' : "") + ">" +
         '<span class="q">' + x.q + "</span>" +
         '<span class="txt">' + esc(x.t) +
         '<span class="due' + (x.hot ? " hot" : "") + '">' + esc(x.due) + "</span></span></div>";
  });
  h += '<div class="bar2"><i style="width:' + Math.round(doneN / w.items.length * 100) + '%"></i></div>';
  /* 考前清单不是采购卡，别把「W36 之后才买的」和「明确别买」两段贴上去 */
  if (w.kind !== "exam"){
    h += '<details><summary>W36（2027-06-27）之后才买的（面板管不到，看板里有日程）</summary><div class="later">' +
         PKG_LATER.map(([d, t]) => "<b>" + esc(d) + "</b> → " + esc(t)).join("<br>") +
         "</div></details>";
    h += '<div class="no"><b>明确别买：</b>' + PKG_NO.map(esc).join(" · ") + "</div>";
  }
  box.innerHTML = h;
  box.querySelectorAll(".row input").forEach(inp => {
    inp.addEventListener("change", () => pkgToggle(inp.getAttribute("data-k")));
  });
}

                : "<span>四级已考完</span>") +
              modeSpan +
              "<span>本周第 <b>" + (wi+1) + "/" + WEEKS.length + "</b> 周</span>"));
  /* ⭐⭐ W32 起（2027-05-24）挂「该补计划了」提醒 —— 用户 2026-10-18 指定。 */
  if (cur >= EXTEND_FROM){
    const leftW = Math.max(1, Math.ceil((PLAN_LAST - cur) / (7 * DAY)));
    metaHTML += '<span style="color:#ff7b72;font-weight:600">⚠️ 细排只剩 <b>' + leftW +
      ' 周</b>（W' + (wi+1) + '–W' + WEEKS.length + '，到 2027-06-27）→ <b>现在该补后续计划了</b>：先把 2027 暑假 8 周填进 WEEKS</span>';
  }
  document.getElementById("meta").innerHTML = metaHTML;

  /* ---- 焦点区 ---- */
  const fb = document.getElementById("focus");
  if (adapting){
    const a = ADAPT[Math.max(0, Math.min(adaptIndexOf(cur), ADAPT.length - 1))];
    fb.innerHTML = "<h3>适应周要做的三件事</h3>" +
      '<div class="frow"><span class="k" style="color:#58a6ff">目标</span><span class="v">测强度：4.5–5.5h/天 能不能长期扛住</span></div>' +
      '<div class="frow"><span class="k" style="color:#e3b341">本周待做</span><span class="v">蓝桥杯摸底：2 套真题（严格计时）+ 失分三分类</span></div>' +
      '<div class="frow"><span class="k" style="color:#3fb950">今天</span><span class="v">' + esc(a ? a.wd : "—") + " · 约 " + (a ? a.min : 0) + ' min（下面只列今天这一天）</span></div>';
  } else {
    fb.innerHTML = "<h3>今天要从这几条线里各推进一步</h3>" +
      /* 408 行必须和下面的任务块同源：块名/条目都取当天真正的块，
         否则会出现「焦点区写数据结构、任务块写组成原理」（2026-10-19 修复）。 */
      '<div class="frow"><span class="k" style="color:#a371f7">' + esc(focusDsNm()) + '</span><span class="v">' + esc(focusDsItems().join(" ｜ ") || "（今天无）") + "</span></div>" +
      '<div class="frow"><span class="k" style="color:#f0883e">算法竞赛</span><span class="v">' + esc(pick(w && w.algo, dow).join(" ｜ ") || "（今天无）") + "</span></div>" +
      '<div class="frow"><span class="k" style="color:#58a6ff">AI 学习</span><span class="v">' + esc(pick(aiOf(w, wi), dow).join(" ｜ ") || "（今天无）") + "</span></div>" +
      /* 数学行：原来概览只有 ds/algo/ai/英语四条线，数学整块被漏掉 ——
         而数学是每天都有内容的（概率 + 线代 + 高数），概览里必须出现。
         概览只给「一眼看今天推哪条线」，所以只放概率主题 + 总时长，
         完整三条（概率/线代/高数）在下面的任务块里，别在这儿重复一遍。 */
      '<div class="frow"><span class="k" style="color:#db6d28">数学</span><span class="v">' + esc(probLine(dow)) + "</span></div>" +
      '<div class="frow"><span class="k" style="color:#f85149">英语材料</span><span class="v">' + esc(enMatLabel((w && w.en && dow >= 1 && dow <= 4) ? w.en[dow-1] : ((w && w.en && w.en[0]) || ""))) + " " + esc((w && w.en && dow >= 1 && dow <= 4) ? w.en[dow-1] : ((w && w.en && w.en[0]) || "—")) + ((w && w.enSent) ? " · 长难句 刘晓艳" + esc(w.enSent) : " · 长难句：已融入阅读/作文") + "</span></div>";
  }

  const box = document.getElementById("blocks");
  const adaptBox = document.getElementById("adaptBox");
  const emptyBox = document.getElementById("emptyBox");
  box.innerHTML = "";

  /* ---- 空态：早于今天 / 早于适应周 ---- */
  if (cur < ADAPT_FROM){
    adaptBox.style.display = "none";
    emptyBox.style.display = "block";
    emptyBox.innerHTML = "⚠️ " + fmt(cur) + " 早于适应周起点，没有内容。<br>" +
      "本面板一屏只显示<b>一天</b>；适应周从 <b>2026-10-12</b> 开始。<br>" +
      "今天是 <b>" + fmt(today0) + "</b>（" + WD[today0.getDay()] + "）。";
    document.getElementById("barfill").style.width = "0%";
    document.getElementById("pct").textContent = "—";
    const b = document.getElementById("previewBtn");
    if (b) b.style.display = "inline-block";
    endRender();
    return;
  }
  emptyBox.style.display = "none";
  const pb0 = document.getElementById("previewBtn");
  if (pb0) pb0.style.display = "none";

  const adaptToday = ADAPT[Math.max(0, Math.min(adaptIndexOf(cur), ADAPT.length - 1))];

  if (adapting){
    adaptBox.style.display = "block";
    adaptBox.innerHTML = "<b>适应周 · " + fmt(cur) + "（" + WD[dow] + "）</b>：摸底还没做 → <b>就在这 4 天里做</b>（10-15 第 1 套 / 10-16 第 2 套 / 10-17 失分三分类 / 10-18 定弱项）。" +
      "所以正式第 1 周从<b>区间调度贪心 / 栈队列 / 手感恢复②</b>开始，跟摸底不重复。" +
      "今天跑完记下三个数字：<b>实际总时长 / 最想放弃的时段 / 哪项超时</b>。";
  } else {
    adaptBox.style.display = "none";
  }

  let total = 0, done = 0;
  const renderKeys = [];
  const seenKey = {};          /* itemKey 的去重计数，必须每天重置 */
  blocks.forEach((b) => {
    const bi = b.bi;
    const items = b.items;
    const el = document.createElement("div");
    el.className = "blk";
    let html = '<div class="hd"><span class="dot" style="background:' + b.color + '"></span>' +
               '<span class="nm">' + esc(b.nm) + "</span>" +
               '<span class="min">' + (Math.round(b.min / 6) / 10) + " h</span></div>" +
               '<div class="bd">';
    if (!adapting && b.src){
      /* 「本周」只给个概览：本周前 3 条 + …，今天具体做什么看下面列出的条目 */
      const brief = arr => {
        const L = (arr || []).map(x => x.t);
        return L.length > 3 ? L.slice(0, 3).join("｜") + "｜… 共 " + L.length + " 项" : L.join("｜");
      };
      /* ⚠️ 这里必须每个 src 都有分支。
         原来 math 没有分支 → 落进最后的 else → 数学块显示了 AI 的周计划
         （现象：「AI 学习」和「数学」两块内容一模一样）。
         数学的内容来自 mathItems()，不是 w.math —— 所以单独取。 */
      const v = b.src === "en"  ? (w.en || []).join("｜")
              : b.src === "ds"  ? brief(dsWeekItems())
              : b.src === "algo"? brief(w.algo)
              : b.src === "ai"  ? brief(w.ai)
              : b.src === "math"? mathItems(dow, cur, b.min).join("｜")
              :                   "";
      if (v) html += '<div class="wk">本周概览：' + esc(v) + "</div>";
      /* 这天有课时（周二概率 3h / 周四五数据结构 2h），块时长被拉长 → 说明一句，
         否则「3h 的数据结构」看着像任务量翻了三倍，实际是课上时间被算进来了。
         ⭐ 2026-10-17：只在**课表已知窗口**（≤ 2027-01-24）显示；之后课表不确定、也不再加时。 */
      if (!adapting && classKnown && b.src === "math" && dow === 2 && b.min >= 170)
        html += '<div class="wk" style="color:#3fb950;background:#0d1c12;border-color:#1f3d26">📌 含学校课上 3h（不听讲，按自己节奏推网课 + 做题）</div>';
      /* 只有块真的装得下「课上 2h」才敢这么写，否则出现「块 1.9 h 却含课上 2h」 */
      if (!adapting && classKnown && b.src === "ds" && (dow === 4 || dow === 5) && b.min >= 90)
        html += '<div class="wk" style="color:#3fb950;background:#0d1c12;border-color:#1f3d26">📌 含学校课上 2h（课上自学推进王道）</div>';
      /* ⭐ 2026-10-17：01-24 之后课表不确定 → 原「课上 2h」已转成 408 自学时间（仍按 3 h 排） */
      if (!adapting && !classKnown && !fin && b.src === "ds" && (dow === 2 || dow === 4 || dow === 5))
        html += '<div class="wk" style="color:#3fb950;background:#0d1c12;border-color:#1f3d26">📌 课表未定：原「课上 2h」已转为 408 自学时间（本块 3 h）</div>';
    }
    html += "<ul></ul></div>";
    el.innerHTML = html;
    const ul = el.querySelector("ul");
    let bDone = 0;
    items.forEach((t, ii) => {
      const id = itemKey(t, seenKey);
      renderKeys.push(id);
      const marked = isMarked(id);
      if (marked) bDone++;
      const li = document.createElement("li");
      if (marked) li.classList.add("done");
      const tag = adapting ? "" : '<span class="daytag">' + DAY_CN[dow] + "</span>";
      li.innerHTML = '<input type="checkbox" ' + (marked ? "checked" : "") + '><span>' + tag + esc(t) + "</span>";
      const tg = () => {
        try {
          if (isMarked(id)) unmark(id); else mark(id);
          render();
        } catch (e) {
          const f = document.getElementById("foot");
          if (f) f.innerHTML = '<b style="color:#f85149">勾选失败：</b>' + e.message + "（按 Ctrl+F5 刷新后重试）";
        }
      };
      li.querySelector("input").addEventListener("change", tg);
      li.querySelector("span").addEventListener("click", tg);
      ul.appendChild(li);
    });
    total += items.length; done += bDone;
    if (items.length && bDone === items.length) el.classList.add("complete");
    box.appendChild(el);
  });

  /* 改过条目后，旧键会留在 localStorage 里让「本周完成」虚高 → 每次渲染顺手清掉 */
  if (!preview){
    const alive = {};
    renderKeys.forEach(k => { alive[k] = 1; });
    let dirty = false;
    Object.keys(state).forEach(k => { if (!alive[k]) { delete state[k]; dirty = true; } });
    if (dirty) saveState();
  }

  const pct = total ? Math.round(done / total * 100) : 0;
  document.getElementById("barfill").style.width = pct + "%";
  document.getElementById("pct").textContent = pct + "%";

  /* ---- 今日 / 本周 / 全程 三行进度 ---- */
  auditNote = "";
  let wkDone = 0, wkTotal = 0, allDone = 0;
  const idx = Math.min(wi, WEEKS.length - 1);
  if (!adapting && idx >= 0){
    const wkStart = new Date(START.getTime() + idx * 7 * DAY);
    wkTotal = WEEK_TOTAL[idx];
    wkDone = preview ? 0 : weekDone(wkStart);
    allDone = WEEK_TOTAL.slice(0, idx).reduce((a,b) => a + b, 0) + wkDone;
  }

  const f = document.getElementById("foot");
  if (f) f.innerHTML =
    (preview ? '<div style="color:#e3b341"><b>试勾模式</b>：你正在试勾 ' + fmt(cur) + " 这一天，" +
               '<b>不会计入正式进度</b>。<button onclick="stopPreview()" style="margin-left:6px;background:#1c232c;color:#e6edf3;border:1px solid #283039;border-radius:6px;padding:2px 8px;cursor:pointer;font-family:inherit">退出试勾</button></div>' : "") +
    "<div>今日进度 <b>" + done + "/" + total + " · " + pct + "%</b>　" +
      (adapting ? "（适应周第 " + (adaptIndexOf(cur)+1) + "/" + ADAPT.length + " 天）"
                : "本周进度 <b>" + wkDone + "/" + wkTotal + "</b>　全程 " + allDone + "/" + WEEK_ALL) +
    "</div>" +
    (persistOK ? "勾选按「日期」分别保存（localStorage）· " + esc(savedAtText()) + "（每次勾选都会自动存，也可以点「💾 保存进度」）"
               : '<b style="color:#f0883e">⚠️ 本机浏览器禁用了本地存储：勾选只在本次打开期间有效，关掉页面会丢 —— 请用「⬇️ 导出备份」把进度存成文件</b>') +
    " · 一屏只显示一天 · 每周明细已拆到「天」<br>本面板管「今天做什么」；「整个计划」看 <b>进度看板.html</b>";

  endRender();
}

/* 通知外部「这一轮渲染结束」（自测脚本靠它区分新旧 DOM） */
function endRender(){
  if (typeof window !== "undefined" && typeof window.__dshRenderEnd === "function") window.__dshRenderEnd();
}

/* ---- 全程总任务数 + 每周任务数 ---- */
const WEEK_TOTAL = WEEKS.map((w, i) => weekTotal(w, false, isFinal(new Date(START.getTime() + i*7*DAY)), i));
const WEEK_ALL = WEEK_TOTAL.reduce((a, b) => a + b, 0);

/* 用 DOMContentLoaded + try/catch 启动：任何异常都显示在页脚，不再白屏 */
document.addEventListener("DOMContentLoaded", function () {
  try {
    render();
  } catch (e) {
    var f = document.getElementById("foot");
    if (f) f.innerHTML = '<b style="color:#f85149">面板启动失败：</b>' + e.message + "（按 Ctrl+F5 刷新）";
  }
});
</script>

render();
</script>
</body>
</html>
