<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 学习规划 · 进度看板</title>
<style>
  :root{
    --bg:#0e1116; --card:#161b22; --card2:#1c232c; --line:#283039;
    --text:#e6edf3; --dim:#9aa7b4; --dim2:#68737f; --green:#3fb950;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);padding:24px 20px 90px;line-height:1.65;
    font-family:"Microsoft YaHei UI","Microsoft YaHei",system-ui,-apple-system,sans-serif}
  .wrap{max-width:1500px;margin:0 auto}

  header{background:linear-gradient(135deg,#161d29,#111620);border:1px solid var(--line);
    border-radius:18px;padding:22px 24px}
  h1{font-size:24px;font-weight:700}
  .goal{color:#58a6ff;font-size:14.5px;margin-top:6px}
  .sub2{color:var(--dim2);font-size:12.5px;margin-top:4px}

  /* 三轨时间轴 */
  .gantt{margin-top:18px}
  .lane{display:flex;align-items:center;gap:10px;margin-bottom:7px}
  .laneName{width:88px;font-size:12px;font-weight:700;text-align:right;flex:none}
  .laneBody{position:relative;flex:1;height:26px;background:#0a0d11;border-radius:7px;
    border:1px solid var(--line);overflow:hidden}
  .seg{position:absolute;top:0;height:100%;display:flex;align-items:center;padding:0 8px;
    font-size:11px;color:#07131f;font-weight:700;white-space:nowrap;overflow:hidden;
    border-right:1px solid rgba(0,0,0,.25);transition:.15s;cursor:default}
  .seg:hover{filter:brightness(1.15)}
  .axis{display:flex;justify-content:space-between;color:var(--dim2);font-size:11px;
    margin:4px 0 0 98px}

  .barwrap{margin-top:18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .bar{flex:1;min-width:220px;height:12px;background:#0a0d11;border-radius:99px;overflow:hidden;border:1px solid var(--line)}
  .bar > i{display:block;height:100%;width:0;background:linear-gradient(90deg,#3b9dff,#3fb950);transition:width .35s}
  .pct{font-size:21px;font-weight:700;min-width:70px;text-align:right}

  .next{margin-top:14px;background:#0c1622;border:1px solid #1d3a55;border-left:4px solid #3b9dff;
    border-radius:10px;padding:11px 15px;font-size:13.5px}
  .next b{color:#79c0ff}

  .chips{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 18px}
  .chip{padding:7px 13px;border-radius:99px;border:1px solid var(--line);background:var(--card);
    font-size:12.5px;cursor:pointer;user-select:none;transition:.15s;display:flex;align-items:center;gap:7px}
  .chip:hover{border-color:#3d4655}
  .chip.active{background:#1f2733;border-color:#44546b}
  .chip .dot{width:8px;height:8px;border-radius:99px}
  .chip .n{color:var(--dim2);font-size:11.5px}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(365px,1fr));gap:14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
  .card:hover{border-color:#39424f}
  .card .top{height:4px}
  .inner{padding:14px 16px 16px;display:flex;flex-direction:column;height:100%}
  .row1{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
  .when{font-size:11.5px;color:var(--dim2)}
  .tk{font-size:11px;padding:2px 8px;border-radius:99px;font-weight:700}
  .cnt{margin-left:auto;font-size:11.5px;color:var(--dim2)}
  .ttl{font-size:16px;font-weight:700;margin-top:4px}
  .deliv{margin-top:8px;font-size:12.5px;padding:6px 10px;border-radius:7px;background:#0d1219;
    border:1px solid var(--line);color:var(--dim)}
  .deliv b{color:#e6edf3;font-weight:600}
  .ky{margin-top:8px;font-size:12px;color:#d29922;background:#1a1508;border:1px solid #3d2f0a;
    border-radius:7px;padding:5px 9px}
  .ky b{color:#e3b341}
  .tag{margin-top:8px;font-size:11.5px;color:#8b949e;background:#0d1219;border:1px dashed #2a323c;
    border-radius:7px;padding:5px 9px}

  ul{list-style:none;margin-top:12px;display:flex;flex-direction:column;gap:7px}
  li{display:flex;gap:9px;align-items:flex-start;font-size:13px;color:#c9d3dd}
  li input{appearance:none;width:17px;height:17px;min-width:17px;margin-top:3px;border:1.5px solid #3f4a5a;
    border-radius:5px;cursor:pointer;position:relative;transition:.15s;background:#0b0f14}
  li input:hover{border-color:#5b6a80}
  li input:checked{background:var(--green);border-color:var(--green)}
  li input:checked::after{content:"";position:absolute;left:5px;top:2px;width:4px;height:8.5px;
    border:solid #06210f;border-width:0 2.5px 2.5px 0;transform:rotate(43deg)}
  li.done span{color:var(--dim2);text-decoration:line-through}
  li span{cursor:pointer}

  details{margin-top:11px;border-top:1px dashed #2a323c;padding-top:10px}
  summary{cursor:pointer;font-size:12.5px;color:#e3b341;list-style:none;user-select:none}
  summary::-webkit-details-marker{display:none}
  summary::before{content:"▸ ";font-size:11px}
  details[open] summary::before{content:"▾ "}
  details ul li{font-size:12.5px}

  .card.complete{border-color:#2c5a3d;background:linear-gradient(180deg,#131e17,#161b22)}
  .card.complete .ttl::after{content:" ✓";color:var(--green)}

  .tools{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}
  button{background:var(--card2);color:var(--text);border:1px solid var(--line);padding:9px 16px;
    border-radius:9px;cursor:pointer;font-size:13px;font-family:inherit;transition:.15s}
  button:hover{border-color:#4a5568;background:#232a35}
  footer{margin-top:30px;color:var(--dim2);font-size:12px;text-align:center;line-height:1.9}
  /* ---------- 响应式：窄屏 ---------- */
  @media (max-width: 760px){
    .wrap{padding:16px 12px 40px}
    h1{font-size:19px}
    .grid{grid-template-columns:1fr}
    .gantt .row{grid-template-columns:76px 1fr}
    .chips{gap:6px}
    .chip{padding:4px 9px;font-size:12px}
    .goal,.sub2{font-size:12px}
    li{font-size:12.5px}
    .tools button{padding:8px 12px;font-size:12px}
  }
  @media (max-width: 430px){
    h1{font-size:17px}
    .chip{padding:3px 7px;font-size:11px}
    .gantt{font-size:10px}
  }
  html{scroll-behavior:smooth}
</style>
</head>

  <header>
    <h1>AI 学习规划 · 进度看板</h1>
    <div style="margin:10px 0 14px"><a href="今日面板.html" target="_blank" rel="noopener"

    <button onclick="window.print()">打印 / 存 PDF</button>
  </div>

  <footer>
    进度自动保存在浏览器本地 · 点顶部「线」可以只看某一条线（算法竞赛 / Python·AI / 考研）<br>

</div>

/* 本地存储容错：隐私模式 / 某些 file:// 下读写 localStorage 会抛异常，
   原来没有 try/catch → 第 564 行就中断 → 整个看板白屏。这里做兜底。 */
const KEY = "dsh-plan-v3";
let persistOK = true;
const MEM = {};
function lsGet(k){
  try { return localStorage.getItem(k); } catch(e){ persistOK = false; return (k in MEM) ? MEM[k] : null; }
}
function lsSet(k, v){
  try { localStorage.setItem(k, v); } catch(e){ persistOK = false; MEM[k] = String(v); }
}
let state = {};
try { state = JSON.parse(lsGet(KEY) || "{}") || {}; } catch(e){ state = {}; }
if (typeof state !== "object" || state === null || Array.isArray(state)) state = {};
let filterTrack = null;
const grid = document.getElementById("grid");
const chips = document.getElementById("chips");
const uid = (ci, ti, kind) => ci + "|" + kind + "|" + ti;
const save = () => lsSet(KEY, JSON.stringify(state));

function drawGantt(){
  const box = document.getElementById("gantt");
  box.innerHTML = "";
  LANES.forEach(lane => {
    const t = TRACKS[lane.track];
    const row = document.createElement("div");
    row.className = "lane";
    row.innerHTML = '<div class="laneName" style="color:' + t.color + '">' + (lane.name || t.name) + "</div>" +
                    '<div class="laneBody"></div>';
    const body = row.querySelector(".laneBody");
    lane.segs.forEach(s => {
      const seg = document.createElement("div");
      seg.className = "seg";
      seg.style.left = (s.start / SPAN * 100) + "%";
      seg.style.width = (s.len / SPAN * 100) + "%";
      seg.style.background = t.color;
      seg.textContent = s.label;
      seg.title = s.tip || s.label;
      body.appendChild(seg);
    });
    box.appendChild(row);
  });
  const ax = document.createElement("div");
  ax.className = "axis";
  ax.innerHTML = "<span>2026.10</span><span>2027.6</span><span>2028.3</span><span>2028.12 初试</span>";
  box.appendChild(ax);
}

function makeList(container, items, ci, kind){
  items.forEach((text, ti) => {
    const id = uid(ci, ti, kind);
    const li = document.createElement("li");
    if (state[id]) li.classList.add("done");
    li.innerHTML = '<input type="checkbox" ' + (state[id] ? "checked" : "") + '><span>' + text + "</span>";
    const toggle = () => { if (state[id]) delete state[id]; else state[id] = true; save(); render(); };
    li.querySelector("input").addEventListener("change", toggle);
    li.querySelector("span").addEventListener("click", toggle);
    container.appendChild(li);
  });
}

function render(){
  drawGantt();
  grid.innerHTML = "";
  CARDS.forEach((c, ci) => {
    if (filterTrack && c.track !== filterTrack) return;
    const t = TRACKS[c.track];
    const all = c.tasks.map((_, ti) => uid(ci, ti, "t")).concat(c.quiz.map((_, ti) => uid(ci, ti, "q")));
    const done = all.filter(k => state[k]).length;
    const complete = all.length > 0 && done === all.length;

    const el = document.createElement("div");
    el.className = "card" + (complete ? " complete" : "");
    el.innerHTML =
      '<div class="top" style="background:' + t.color + '"></div>' +
      '<div class="inner">' +
        '<div class="row1">' +
          '<span class="when">' + c.when + "</span>" +
          '<span class="tk" style="background:' + t.color + '22;color:' + t.color + '">' + t.short + "</span>" +
          '<span class="cnt">' + done + "/" + all.length + "</span>" +
        "</div>" +
        '<div class="ttl">' + c.title + "</div>" +
        '<div class="deliv">产出：<b>' + c.deliv + "</b></div>" +
        (c.kaoyan ? '<div class="ky">' + c.kaoyan + "</div>" : "") +
        "<ul></ul>" +
      "</div>";
    makeList(el.querySelector("ul"), c.tasks, ci, "t");
    if (c.quiz.length){
      const det = document.createElement("details");
      det.innerHTML = "<summary>自测（能不看资料答出来再打勾）</summary><ul></ul>";
      makeList(det.querySelector("ul"), c.quiz, ci, "q");
      el.querySelector(".inner").appendChild(det);
    }
    grid.appendChild(el);
  });
  updateStats();
}

function updateStats(){
  const all = [];
  CARDS.forEach((c, ci) => {
    c.tasks.forEach((_, ti) => all.push(uid(ci, ti, "t")));
    c.quiz.forEach((_, ti) => all.push(uid(ci, ti, "q")));
  });
  const done = all.filter(k => state[k]).length;
  const pct = all.length ? Math.round(done / all.length * 100) : 0;
  document.getElementById("barfill").style.width = pct + "%";
  document.getElementById("pct").textContent = pct + "%";
  document.getElementById("count").textContent = "已完成 " + done + " / " + all.length + " 项";

  let next = null;
  outer:
  for (let ci = 0; ci < CARDS.length; ci++){
    if (filterTrack && CARDS[ci].track !== filterTrack) continue;
    for (const kind of ["t", "q"]){
      const arr = kind === "t" ? CARDS[ci].tasks : CARDS[ci].quiz;
      for (let ti = 0; ti < arr.length; ti++){
        if (!state[uid(ci, ti, kind)]){ next = {c: CARDS[ci], text: arr[ti]}; break outer; }
      }
    }
  }
  document.getElementById("nextbox").innerHTML = next
    ? '下一件该做的事：<b>' + next.text + "</b> <span style='color:#68737f'>（" + next.c.when + " · " + next.c.title + "）</span>"
    : "🎉 全部完成 —— 该上考场了。";

  chips.innerHTML = "";
  const allChip = document.createElement("div");
  allChip.className = "chip" + (filterTrack === null ? " active" : "");
  allChip.innerHTML = "全部线 <span class='n'>" + done + "/" + all.length + "</span>";
  allChip.onclick = () => { filterTrack = null; render(); };
  chips.appendChild(allChip);

  Object.keys(TRACKS).forEach(tid => {
    const idxs = CARDS.map((c, i) => c.track === tid ? i : -1).filter(i => i >= 0);
    if (!idxs.length) return;
    let total = 0, d = 0;
    idxs.forEach(i => {
      const c = CARDS[i];
      total += c.tasks.length + c.quiz.length;
      c.tasks.forEach((_, ti) => { if (state[uid(i, ti, "t")]) d++; });
      c.quiz.forEach((_, ti) => { if (state[uid(i, ti, "q")]) d++; });
    });
    const t = TRACKS[tid];
    const c2 = document.createElement("div");
    c2.className = "chip" + (filterTrack === tid ? " active" : "");
    c2.innerHTML = "<span class='dot' style='background:" + t.color + "'></span>" + t.name +
                   " <span class='n'>" + idxs.length + " 张卡 · " + d + "/" + total + "</span>";
    c2.onclick = () => { filterTrack = (filterTrack === tid ? null : tid); render(); };
    chips.appendChild(c2);
  });
}

function expandAll(open){ document.querySelectorAll("details").forEach(d => d.open = open); }
function clearAll(){
  if (!confirm("确定清空所有勾选？（不可撤销）")) return;
  state = {}; save(); render();
}

/* 任何脚本错误都显示在页面上，而不是白屏 */
window.onerror = function (msg, src, line, col) {
  var el = document.getElementById("count");
  if (el) el.innerHTML = '<b style="color:#f85149">看板出错了：</b>' + msg + "（位置 " + (src || "?") + ":" + line + ":" + col + "）";
  return false;
};

try {
  render();
  if (!persistOK) {
    var cc = document.getElementById("count");
    if (cc) cc.innerHTML += ' &nbsp;<b style="color:#f0883e">⚠️ 本机浏览器禁用了本地存储：勾选只在本次打开期间有效</b>';
  }
} catch (e) {
  var el2 = document.getElementById("count");
  if (el2) el2.innerHTML = '<b style="color:#f85149">看板启动失败：</b>' + e.message + "（按 Ctrl+F5 刷新）";
}
</script>
