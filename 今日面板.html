<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>今日面板 · 每天自动换</title>
<style>
  :root{
    --bg:#0e1116; --card:#161b22; --card2:#1c232c; --line:#283039;
    --text:#e6edf3; --dim:#9aa7b4; --dim2:#68737f; --green:#3fb950;
    --blue:#58a6ff; --orange:#f0883e; --red:#f85149; --purple:#a371f7;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);padding:22px 18px 80px;line-height:1.6;
    font-family:"Microsoft YaHei UI","Microsoft YaHei",system-ui,-apple-system,sans-serif}
  .wrap{max-width:1200px;margin:0 auto}
  header{background:linear-gradient(135deg,#161d29,#111620);border:1px solid var(--line);
    border-radius:18px;padding:20px 22px;margin-bottom:16px}
  .top{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
  h1{font-size:23px;font-weight:700}
  .badge{font-size:12px;padding:3px 10px;border-radius:99px;font-weight:700}
  .nav{margin-left:auto;display:flex;gap:6px}
  .nav button{background:var(--card2);color:var(--text);border:1px solid var(--line);
    padding:6px 12px;border-radius:8px;cursor:pointer;font-size:12.5px;font-family:inherit}
  .nav button:hover:not(:disabled){border-color:#4a5568;background:#232a35}
  .nav button:disabled{opacity:.35;cursor:not-allowed}
  /* 跳去「进度看板」的链接：外观跟旁边的按钮一致，但它是 <a>（新标签页打开） */
  .nav .navlink{display:inline-block;background:#1f6feb;color:#fff;border:1px solid #1f6feb;
    border-radius:6px;padding:5px 11px;font-size:13px;font-weight:700;text-decoration:none;line-height:1.5}
  .nav .navlink:hover{background:#388bfd;border-color:#388bfd}
  .meta{display:flex;gap:18px;flex-wrap:wrap;margin-top:10px;font-size:13px;color:var(--dim)}
  .meta b{color:var(--text)}
  .focus{margin-top:14px;background:#0d1219;border:1px solid var(--line);border-radius:11px;padding:12px 15px}
  .focus h3{font-size:12.5px;color:var(--dim2);font-weight:600;margin-bottom:7px}
  .frow{display:flex;gap:10px;font-size:13.5px;padding:3px 0;align-items:baseline}
  .frow .k{min-width:104px;font-weight:700;font-size:12.5px}
  .frow .v{color:#c9d3dd}
  .barwrap{margin-top:14px;display:flex;align-items:center;gap:13px}
  .bar{flex:1;height:11px;background:#0a0d11;border-radius:99px;overflow:hidden;border:1px solid var(--line)}
  .bar > i{display:block;height:100%;width:0;background:linear-gradient(90deg,#3b9dff,#3fb950);transition:width .3s}
  .pct{font-size:18px;font-weight:700;min-width:60px;text-align:right}
  .blocks{display:grid;grid-template-columns:repeat(auto-fill,minmax(370px,1fr));gap:14px;margin-top:16px}
  .blk{background:var(--card);border:1px solid var(--line);border-radius:13px;overflow:hidden}
  .blk .hd{display:flex;align-items:center;gap:9px;padding:11px 15px;border-bottom:1px solid var(--line)}
  .blk .dot{width:9px;height:9px;border-radius:99px}
  .blk .nm{font-size:15px;font-weight:700}
  .blk .min{margin-left:auto;font-size:12px;color:var(--dim2)}
  .blk .bd{padding:12px 15px 14px}
  .blk .wk{font-size:12.5px;color:#e3b341;background:#1a1508;border:1px solid #3d2f0a;
    border-radius:7px;padding:5px 9px;margin-bottom:9px}
  .daytag{display:inline-block;font-size:11px;font-weight:700;color:#0e1116;background:var(--dim);
    border-radius:5px;padding:0 5px;margin-right:6px;vertical-align:1px}
  ul{list-style:none;display:flex;flex-direction:column;gap:7px}
  li{display:flex;gap:9px;align-items:flex-start;font-size:13.5px;color:#c9d3dd}
  li input{appearance:none;width:17px;height:17px;min-width:17px;margin-top:3px;border:1.5px solid #3f4a5a;
    border-radius:5px;cursor:pointer;position:relative;transition:.15s;background:#0b0f14}
  li input:hover{border-color:#5b6a80}
  li input:checked{background:var(--green);border-color:var(--green)}
  li input:checked::after{content:"";position:absolute;left:5px;top:2px;width:4px;height:8.5px;
    border:solid #06210f;border-width:0 2.5px 2.5px 0;transform:rotate(43deg)}
  li.done span{color:var(--dim2);text-decoration:line-through}
  li span{cursor:pointer}
  .blk.complete{border-color:#2c5a3d}
  .adapt{background:#161b22;border:1px solid #2d3f57;border-left:4px solid var(--blue);
    border-radius:11px;padding:13px 16px;margin-top:16px;font-size:13.5px;color:var(--dim)}
  .adapt b{color:#79c0ff}
  .empty{background:var(--card);border:1px dashed var(--line);border-radius:13px;
    padding:34px 20px;text-align:center;color:var(--dim);font-size:14px;margin-top:16px;line-height:2}
  .tools{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}
  .tools button{background:var(--card2);color:var(--text);border:1px solid var(--line);
    padding:9px 16px;border-radius:9px;cursor:pointer;font-size:13px;font-family:inherit}
  .tools button:hover{border-color:#4a5568;background:#232a35}
  footer{margin-top:26px;color:var(--dim2);font-size:12px;text-align:center;line-height:1.9}
  /* ---------- 响应式：窄屏（手机 / 平板竖屏） ---------- */
  @media (max-width: 720px){
    /* ⭐ 2026-10-17 手机/平板使用：窄屏下长串不换行会把整页撑出横向滚动条，
       勾选框会被挤出屏幕。这两条是保险，桌面端不受影响。 */
    body{overflow-x:hidden}
    li, .blk .nm, .wk{overflow-wrap:anywhere;word-break:break-word}
    .wrap{padding:0 12px}
    h1{font-size:19px}
    .meta{gap:10px;font-size:12px}
    .focus{padding:13px 14px}
    .frow{flex-direction:column;gap:2px}
    .frow .k{min-width:0;font-size:11.5px;color:var(--dim2)}
    .blk{padding:11px 12px}
    .blk .nm{font-size:14px}
    li{font-size:13px}
    .daytag{font-size:10px}
    .nav{gap:6px}
    .nav button,.nav .navlink{padding:5px 9px;font-size:12px}
    .pct{font-size:15px;min-width:48px}
  }
  @media (max-width: 420px){
    h1{font-size:17px}
    .nav button,.nav .navlink{padding:4px 7px;font-size:11px}
    li{font-size:12.5px}
  }
  /* ---------- 平滑滚动 ---------- */
  html{scroll-behavior:smooth}
  /* ---------- 勾选后条目变暗，一眼看出进度 ---------- */
  li.done{opacity:.45}
  li.done .txt{text-decoration:line-through;text-decoration-color:var(--dim2)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="top">
      <h1 id="dateTitle">—</h1>
      <span class="badge" id="phaseBadge">—</span>
      <div class="nav">
        <button id="btnPrev" onclick="shift(-1)">← 前一天</button>
        <button onclick="goToday()">今天</button>
        <button id="btnNext" onclick="shift(1)">后一天 →</button>
        <a href="进度看板.html" target="_blank" rel="noopener" class="navlink">📋 进度看板</a>
      </div>
    </div>
    <div class="meta" id="meta"></div>
    <div class="focus" id="focus"></div>
    <div class="barwrap"><div class="bar"><i id="barfill"></i></div><div class="pct" id="pct">0%</div></div>
  </header>
  <div class="adapt" id="adaptBox" style="display:none"></div>
  <div class="blocks" id="blocks"></div>
  <div class="empty" id="emptyBox" style="display:none"></div>
  <div style="text-align:center;margin-top:14px">
    <button id="previewBtn" onclick="startPreview(nextActiveOffset())" style="display:none;background:#1c232c;color:#e6edf3;border:1px solid #4a5568;border-radius:9px;padding:9px 18px;cursor:pointer;font-size:13px;font-family:inherit">👀 跳到下一个有内容的日子（试勾，不影响正式进度）</button>
  </div>
  <div class="tools">
    <button onclick="saveNow()" title="立刻把当前勾选写进浏览器存储，并显示保存时间">💾 保存进度</button>
    <button onclick="exportProgress()" title="把所有日期的勾选导出成一个 JSON 文件（可以放进工作区备份）">⬇️ 导出备份</button>
    <button onclick="document.getElementById('importFile').click()" title="从之前导出的 JSON 恢复勾选">⬆️ 导入备份</button>
    <button onclick="clearToday()">清空当天勾选</button>
    <button onclick="window.print()">打印今天</button>
    <input type="file" id="importFile" accept=".json,application/json" style="display:none" onchange="importProgress(this)">
    <button onclick="alert('核心规则：\n\n1. 一屏 = 一天。只显示你选的那一天，不再把一周摊开。\n2. 早于今天的日子不再显示（适应周已过完就翻不回去了）。\n3. 正式周按天拆分：周一~周五各不同 —— 算法 5 道题摊到 5 天、数据结构章节按天推进、AI 每天 1 个动作，周末是收口。\n4. 勾选按日期分别保存（localStorage），切日期不会丢；每次勾选都自动保存。\n5. 想手动确认就点「💾 保存进度」；想换浏览器/清记录前先点「⬇️ 导出备份」。\n6. 每天 0 点后刷新就是新的一天。')">怎么用？</button>
  </div>
  <footer id="foot">勾选按「日期」分别保存（localStorage）· 一屏只显示一天 · 每周明细已拆到「天」<br>
    本面板管「今天做什么」；「整个计划」看 <b>进度看板.html</b></footer>
</div>

<script>
/* 任何脚本错误都在页面上显示出来，而不是白屏 —— 不然「勾了不动」根本查不出原因 */
window.onerror = function (msg, src, line, col) {
  var f = document.getElementById("foot");
  if (f) f.innerHTML = '<b style="color:#f85149">面板出错了：</b>' + msg +
    "<br>（位置 " + (src || "?") + ":" + line + ":" + col + "）先按 Ctrl+F5 强制刷新；还不行就看 F12 Console。";
  return false;
};
/* ================================================================
   关键日期
   START      = 2026-10-19（正式第 1 周 · 周一）
   适应周剩余 = 2026-10-15 ~ 10-18（蓝桥杯摸底：这 4 天里做，10-18 定最弱 3 考点）
   规则：早于「今天」的日期一律不再显示
   ================================================================ */
const START      = new Date(2026, 9, 19);
const ADAPT_FROM = new Date(2026, 9, 12);
const ADAPT_TO   = new Date(2026, 9, 18);
const FINAL_FROM = new Date(2026, 11, 1);
/* ⭐ 2026-10-16 改动：期末缓冲延长到 2027-01-24（用户：「1 月 24 号才能确保考试结束」）。
   覆盖 W7 后半 + W8 ~ W14（整整 7 周）。W15（01-25）起恢复正常强度。
   注意：四级考试（2026-12-12，落在 W8）优先于期末缓冲 —— 那一周仍按四级冲刺排。 */
const FINAL_TO   = new Date(2027, 0, 24);
/* 数据结构考试：用户 2026-10-16 决定**取消**面板上的考期安排（学校没给确定日期）。
   常量保留是为了兼容其它引用，但不再用于倒计时显示。 */
const DS_EXAM    = null;
/* 四级考试 2026-12-12（周六），落在 W8。用于页脚倒计时（用户 2026-10-16 确认）。 */
const CET4_EXAM  = new Date(2026, 11, 12);
/* ⭐ 期末考期结束日（用户：「1 月 24 号才能确保考试结束」）。
   此日（含）之前一律按「考试期」处理：数学整块隐藏、概率不排复习。
   这是**唯一**的考期结束口径，不要在别处再写死日期。 */
const EXAM_END   = new Date(2027, 0, 24);
/* ⭐ 蓝桥杯省赛（用户目标：冲省一）。2026 年第十七届实测为 **2026-04-11 ~ 04-12**
   （4 月第 2 个周末，见成都文理学院赛点通报）。2027 年官方尚未公布，
   按同一节奏推算为 **2027-04-10（周六）** → 落在 W25。
   ⚠️ 官方通知出来后只改这一行即可（面板按日期找周，不靠硬编码周号）。 */
const PROVINCIAL_EXAM = new Date(2027, 3, 10);
/* ⭐ 六级考试：CET 六月场固定在 6 月第 2 / 第 3 个周六（2026-06-13 为第 2 个周六）。
   2027 年推算 **2027-06-19（周六）** → 落在 W35（06-14~06-20，正是「6 月中旬」整周，
   与面板原有「2027-06 中旬」的口径一致）。同样「以官方通知为准」。 */
const CET6_EXAM  = new Date(2027, 5, 19);
/* ⭐ 寒假（2027-01-25 缓冲结束 ~ 02-28）：全年可支配时间最多的一段。
   省赛前把算法时间 +30 min/天，用强度换回缓冲期吃掉的那 2 周准备期。 */
const WINTER_FROM = new Date(2027, 0, 25);
const WINTER_TO   = new Date(2027, 1, 28);
const DAY = 86400000;
let DEBUG_KEYS = null;   /* 设成数组就记录本日实际使用的 key（自测脚本用，正常打开为 null） */
const DCODE = {M:1, T:2, W:3, R:4, F:5, S:6, U:0};   // js getDay(): 0=周日
const DAY_CN = ["周日","周一","周二","周三","周四","周五","周六"];

/* ================================================================
   每周明细（已按天拆分）
   {d:"M", t:"..."}  d = 出现的那一天：M周一 T周二 W周三 R周四 F周五 S周六 U周日
   ds / algo / ai  三类任务各自带天；en 是本周听力材料池（周一~周四各一套）

/* 某天概率该看哪一章（按日期往后找最近的一个；超出课程结束后返回 null）
   ⭐ 2026-10-17：拆出 probChapterRaw(d) ——
     ① 缓冲期要用「当天章节」，不能因为处在考期窗口就算成 null（那样期末复习没内容可排）；
     ② 带日期参数，是为了让「本周/全程」统计能按**被统计的那一天**算条目数，
        而不是永远按今天（cur）算 —— 否则缓冲周的总任务数会统计错。 */
function probChapterRaw(d){
  d = d || cur;
  let hit = PROB_PLAN[0];
  for (let i = 0; i < PROB_PLAN.length; i++){
    if (d >= parseDay(PROB_PLAN[i].from)) hit = PROB_PLAN[i];
    else break;
  }
  if (hit.until && d > parseDay(hit.until)) return null;   /* 概率期末已过 → 不再显示 */
  return hit;
}
function probNow(){ return probChapterRaw(cur); }

/* ---- localStorage 容错 ----------------------------------------------------
   隐私模式 / 某些 file:// 或安全策略下，读 localStorage 会直接抛异常。
   原来这里没有 try/catch → loadState() 抛错 → render() 整个中断 → 页面白屏、
   勾选框全部无响应、进度条永远不动。改成本地兜底 + 明确提示。          */
let persistOK = true;
const MEM = {};
function lsGet(k){
  try { return localStorage.getItem(k); } catch(e){ persistOK = false; return (k in MEM) ? MEM[k] : null; }
}
function lsSet(k, v){
  try { localStorage.setItem(k, v); } catch(e){ persistOK = false; MEM[k] = String(v); }
}
const loadState = () => {
  try { state = JSON.parse(lsGet(KEY(fmt(cur))) || "{}") || {}; }
  catch(e){ state = {}; }
  if (typeof state !== "object" || state === null || Array.isArray(state)) state = {};
};
const saveState = () => {

};

/* ---- 手动保存 / 导出备份 / 导入备份 --------------------------------------
   为什么要这三个：
     panel 默认是「勾一下就自动存」，但它没有任何「保存」按钮 ——
     用户会以为没保存（确实有人这么反馈过）。所以补上：
       保存进度 = 立刻写一次 + 在页脚确认并显示保存时间
       导出备份 = 把所有日期的勾选下载成 progress-YYYY-MM-DD.json
       导入备份 = 从那份 JSON 恢复（换浏览器 / 清过记录后能救回来）        */
function humanTime(iso){
  if (!iso) return "";
  const d = new Date(iso);
  if (isNaN(d.getTime())) return "";
  const p = n => (n < 10 ? "0" + n : "" + n);
  return d.getFullYear() + "-" + p(d.getMonth()+1) + "-" + p(d.getDate()) + " " +
         p(d.getHours()) + ":" + p(d.getMinutes()) + ":" + p(d.getSeconds());
}
function savedAtText(){
  const t = humanTime(lsGet(KEY("savedAt")));
  return t ? "上次保存 " + t : "还没保存过";
}
function saveNow(){
  const NL = String.fromCharCode(10);
  persistOK = true;
  saveState();
  const t = humanTime(lsGet(KEY("savedAt")));

           "已勾选：" + Object.keys(state).length + " 条", "",
           "（其实你每次勾选都会自动保存，这个按钮只是让你看得见。）"].join(NL));
  } else {
    alert(["保存失败 ❌", "", "本机浏览器禁用了本地存储，勾选只在本次打开期间有效。",
           "解决办法看页面顶部说明，或用「导出备份」把进度存成文件。"].join(NL));
  }
  render();
}
function exportProgress(){
  const NL = String.fromCharCode(10);
  const keys = {};
  try {
    for (let i = 0; i < localStorage.length; i++){
      const k = localStorage.key(i);
      if (k && k.indexOf("dsh-today-") === 0) keys[k] = JSON.parse(localStorage.getItem(k) || "null");
    }
  } catch (e) {
    alert("导出失败：读不到本机存储（" + e.name + "）。" + NL + "本机浏览器可能禁用了本地存储。");
    return;
  }
  const dates = Object.keys(keys).filter(k => k.indexOf("savedAt") < 0 && k.indexOf("preview") < 0);
  const payload = { app: "dsh-today-panel", version: 1, exportedAt: new Date().toISOString(), keys: keys };
  const name = "progress-" + fmt(today0) + ".json";
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = name;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => { try { URL.revokeObjectURL(url); } catch (e) {} }, 2000);
  alert(["已导出备份 ⬇️", "", "文件：" + name,
         "包含日期：" + (dates.length ? dates.map(k => k.replace("dsh-today-", "")).join(", ") : "（还没有任何勾选）"),
         "", "建议把它放到 D:\ai-Study\ 下面留一份。"].join(NL));
}
function importProgress(input){
  const NL = String.fromCharCode(10);
  const f = input && input.files && input.files[0];
  if (!f) return;
  const rd = new FileReader();
  rd.onload = function(){
    let obj = null;
    try { obj = JSON.parse(rd.result); } catch (e) { obj = null; }
    if (!obj || typeof obj !== "object" || !obj.keys || typeof obj.keys !== "object"){
      alert("导入失败：这个文件不是面板导出的备份（应当包含 keys 字段）。");
      input.value = "";
      return;
    }
    let n = 0;
    Object.keys(obj.keys).forEach(function(k){
      if (k.indexOf("dsh-today-") === 0){ lsSet(k, JSON.stringify(obj.keys[k])); n++; }
    });
    alert(["已导入 " + n + " 天的记录 ✅", "导出时间：" + humanTime(obj.exportedAt), "",
           "页面会刷新一下以显示导入结果。"].join(NL));
    input.value = "";
    location.reload();
  };
  rd.onerror = function(){ alert("导入失败：文件读不出来。"); input.value = ""; };
  rd.readAsText(f, "utf-8");
}

   - 否则按 【OS】/【网络】/组成原理/王道等内容词计分
   - 期末缓冲周（fin）在后面统一加「（期末复习）」后缀 */
const SUBJ_ORDER = ["数据结构", "组成原理", "操作系统", "计算机网络"];
const SUBJ_RE = {
  "数据结构":   /王道|数据结构|线性表|链表|KMP|二叉树|哈夫曼|并查集|邻接矩阵|邻接表|MST|最短路|拓扑|关键路径|折半|BST|AVL|散列|ASL|快排|堆排|归并排序|败者树/g,
  "组成原理":   /组成原理|组原|Cache|流水线|指令系统|数据通路|微程序|总线|DMA|IEEE|浮点|补码|原码|移码|存储系统|主存|SRAM|DRAM|TLB|虚拟存储|RAID|CPU|冯诺依曼|寻址|CISC|RISC|CPI|MIPS|溢出判断|扩展操作码/g,
  "操作系统":   /【OS】|操作系统/g,
  "计算机网络": /【网络】|计算机网络/g,
};
function dsSubject(w){
  /* ⭐ 2026-10-17：每周显式声明 subj（见 WEEKS 的 dict(subj=...)），不再靠关键词猜 ——
     关键词法一旦遇到「王道」这种四门共用的书名就会判错（组成原理周被判成数据结构）。 */
  if (w && w.subj) return w.subj;
  /* ⭐ 2026-10-17：「王道」是四门共用的书名（王道 3.1 栈 / 王道 3.1 存储层次 / 王道 2.1 进程 …），
     不剥掉就会把 OS、网络、组成原理的周全算成「数据结构」。判科前先去掉书名。 */
  const text = ((w && w.ds) || []).map(x => x.t).join(" ").replace(/王道/g, " ");
  if (/408 串联|把四门|四门串联/.test(text)) return "408（四门串联）";
  const score = {};
  SUBJ_ORDER.forEach(n => { score[n] = (text.match(SUBJ_RE[n]) || []).length; });
  const ranked = SUBJ_ORDER.slice().sort((a, b) => score[b] - score[a]);
  const top = score[ranked[0]], second = score[ranked[1]];
  if (top === 0) return "408";
  /* 次高分 ≥ 最高分的一半 → 这周确实在跨科目（如 W28 OS 二轮 + 网络起步）；
     只把「同样占分」的科目列进去，避免个别书目名（如「王道」）被算成一门。 */
  if (second > 0 && second * 2 >= top)
    return "408（" + ranked.filter(n => score[n] * 2 >= top).join(" + ") + "）";
  return ranked[0];
}
function dsLabel(w, fin){
  const s = dsSubject(w);
  if (!fin) return s;
  return (s === "408") ? "408（期末复习）" : s + "（期末复习）";
}

function buildItems(b, w, dow, wi, d){
  if (b.fixed) return b.fixed.slice();
  const out = [];
  /* ⭐ 2026-10-17：单词进度必须定义在任何分支之前 —— 原来定义在 const stage 之后，
     四级冲刺分支（更早）用到就会 TDZ: Cannot access 'wordProg' before initialization。 */
  const wordProg2 = (st, idx) => {
    if (st === "cet6") return "（5500 词表 · 第 " + (idx - 12) + "/23 组）";
    if (st === "post") return "（一轮 · 第 " + (idx - 7) + "/5 组）";
    return "（第 " + (idx + 1) + "/8 组）";
  };
  if (b.src === "en"){
    const pool = (w && w.en) ? w.en : [];
    const isWeekend = (dow === 0 || dow === 6);
    /* ⭐ 2026-10-17 新增：四级冲刺周（2026-12-07 ~ 12-13）单独一套英语内容。
       用户要求：英语提到 150 min/天（听力最弱、四级 399），但**不许挤压周二概率、周四周五数据结构**
       —— 所以这两块仍是 60 min（见 TPL.cet4Work），只把英语时间加上去。
       12-12 是考试日（上午 130 min 考试），12-13 是考后复盘日。 */
    if (isCet4Sprint(d)){
      const m = fmt(d);
      if (m === "2026-12-12"){
        out.push("⭐ 四级考试（09:00–11:20，130 min）：听力先扫选项再听，作文留足 25 min");
        out.push("考后复盘 20 min：只记感受（哪几题没跟上、哪段听得最慌），当天不查答案");
      } else if (m === "2026-12-13"){
        out.push("四级复盘 40 min：听力错题对原文，写清原因（走神 / 词不认识 / 连读没听出）");
        out.push("单词 30 min：四级核心词（最后一天，下周起换考研红宝书）");
        out.push("阅读 30 min：四级阅读真题 1 篇（保持手感，不追新题）");
      } else {
        out.push("四级听力精听 60 min：" + (pool[dow-1] || pool[0] || "四级真题听力") +
          "（整套 Section A/B/C：先做题 → 逐句听写 → 对原文标原因）");
        out.push("单词 40 min：四级核心词 100 个" + wordProg2("cet4", wi) + " + 昨日错词（只记发音和拼写，不抄词根）");
        out.push("四级阅读真题 50 min：1 套限时 40 min + 精读错的那 2 篇 10 min");
      }
      return out;
    }
    /* 英语 100 min。三个阶段（阶段由 **周次** 决定，见 STAGE）：
       STAGE 'cet4'   W1–W8 ：四级阶段 —— 四级听力 + **四级核心词** + 四级阅读
       STAGE 'post'   W9–W13：四级已考完（2026-12-12）、期末缓冲 ——
                             不再练四级听力；**背考研红宝书（一轮）** + 英一阅读精读
       STAGE 'cet6'   W14+  ：六级阶段 —— 六级听力 + 六级词 + 英一阅读 + 六级专项

       ⚠️ 历史 bug（2026-10-16 修）：原来只分「四级 / 六级」两段，分界是 wi>=13（W14）。
         于是 W9–W13 落在四级分支里，把 enMaterial 里的**英一阅读**当**听力材料**渲染，
         变成「听力精听 30 min：英一：2005 年阅读 Text 3 精读（逐句听写）」，
         而且四级考完还继续显示「单词 30 min：四级核心词 / 阅读真题（四级阅读）」。
       周末只留单词 + 长难句（+六级专项）—— 周末科目多，再堆听力和阅读会压垮。
       长难句只有周末排，且必须有 enSent（W5–W8 四级冲刺期为空 = 暂停）。 */
    const stage = (wi >= 13) ? "cet6" : ((wi >= 8) ? "post" : "cet4");

    if (isWeekend){
      out.push(stage === "cet6" ? "单词 30 min：六级核心词" + wordProg2("cet6", wi)
             : stage === "post" ? "单词 30 min：考研红宝书" + wordProg2("post", wi)
             : "单词 30 min：四级核心词" + wordProg2("cet4", wi));
      if (w && w.enSent)
        out.push("⭐ 长难句 50 min：刘晓艳《不就是语法和长难句吗？》" + w.enSent
               + "（看课 → 抄句 → 划成分 → 翻译 → 对答案，一次做 3–4 句）");
      else
        out.push(stage === "cet6"
          ? "（长难句 65 讲已走完：本周英语只保单词 + 六级专项）"
          : (stage === "cet4"
             ? "（四级冲刺期：长难句暂停，本周英语只保单词）"
             : "（长难句已并入阅读精读：本周英语只保单词 + 阅读）"));
      if (stage === "cet6") out.push("六级专项 20 min：六级真题（听力 1 篇 / 阅读 1 篇 轮换，严格计时）");
      return out;
    }
    if (stage === "cet6"){
      /* enMaterial 四条的含义随阶段变：
         四级阶段 [听力1,听力2,听力3,听力4]
         六级阶段 [六级听力, 英一阅读Text1, 英一阅读Text2, 六级翻译/写作]
         → 听力取 en[0]，阅读取 en[1..2]，专项取 en[3]。 */
      const enMat = (w && w.enMaterial) || [];
      const listenMat = enMat[0] || (w && w.en && w.en[0]) || "六级真题听力";
      const readMat = enMat[1 + Math.min(Math.max(dow - 1, 0), 1)] || "英一真题精读";
      out.push("六级听力 30 min：" + listenMat + "（听写 → 对原文找原因）");
      out.push("单词 30 min：六级核心词" + wordProg2("cet6", wi));
      out.push("阅读 20 min：" + readMat);
      out.push("六级专项 20 min：" + (enMat[3] || "翻译 / 写作 轮换（六级独有题型）"));
    } else if (stage === "post"){
      /* W9–W13：四级已考完。enMaterial = [总述, 阅读Text1, 阅读Text2, 复盘]
         → 不再当听力材料用；改成「红宝书 + 英一阅读精读」。 */
      const enMat = (w && w.enMaterial) || [];
      const readMat = enMat[1 + Math.min(Math.max(dow - 1, 0), 1)] || enMat[0] || "英一真题精读";
      out.push("单词 30 min：考研红宝书" + wordProg2("post", wi));
      out.push("阅读精读 50 min：" + readMat + "（先做题 → 逐句拆 → 生词进本）");
      out.push("长难句 20 min：从今天这篇里挑 2 句，划成分 + 翻译");
    } else {
      if (dow >= 1 && dow <= 4 && pool[dow-1]) out.push("听力精听 30 min：" + pool[dow-1] + "（逐句听写）");
      else out.push("听力精听 30 min：" + (pool[0] || "—") + "（逐句听写 / 复盘）");
      out.push("单词 30 min：四级核心词" + wordProg2("cet4", wi));
      out.push("阅读真题 20 min（四级阅读）");
    }
  } else if (b.src === "ds"){
    /* 周四、周五各有 2h 数据结构课（**仅 2027-01-24 前课表已知**）。三种情况要分开说，
       否则「块只有 60 min」和「课上 2h」会自相矛盾：
       - 平时：块 180 min = 课上 120 + 自习 60 → 标「【课上 2h】」（内容当场做完，不占课下）
       - 期末缓冲：块只有 60 min 自习，课上 2h **不在这块里** → 标「【课上 2h 另算】」
       - 01-24 之后：课表不确定、不再假设有课 → 不加任何前缀（块 180 min 全是自习） */
    const hasClass = (dow === 4 || dow === 5) && d <= CLASS_KNOWN_TO;
    const tag = !hasClass ? "" : (isFinal(d) ? "【课上 2h 另算】" : "【课上 2h】");
    pick(w && w.ds, dow).forEach(x => out.push(tag + x));
  } else if (b.src === "algo"){
    pick(w && w.algo, dow).forEach(x => out.push(x));
  } else if (b.src === "ai"){
    pick(aiOf(w, wi), dow).forEach(x => out.push(x));
  } else if (b.src === "math"){
    mathItems(dow, d).forEach(x => out.push(x));
  }
  (b.extra || []).forEach(x => out.push(x));
  return out;
}

/* 某一天每个块最终显示哪些条目（渲染和统计共用这一份，避免两处算法不一致）
   注意：bi 必须是「过滤后可见块的序号」，跟渲染时 box.appendChild 的先后一致；
   不能直接用模板下标 —— 有的天某个块没任务会被跳过，那样 key 就整体错位。 */
function dayBlocks(dow, w, adapting, fin, wi, d){
  const tpl = (adapting ? adaptTemplate() : weekdayTemplate(dow, fin, d));
  const out = [];
  tpl.forEach((b) => {
    const items = adapting ? b.items : buildItems(b, w, dow, wi, d);
    if (!adapting && !b.fixed && items.length === 0) return;   // 今天这块没任务 → 不显示
    /* ⭐ 408 块名跟着本周内容走（数据结构 / 组成原理 / 操作系统 / 计算机网络 / 408） */
    const nm = (b.src === "ds") ? dsLabel(w, fin) : b.nm;
    out.push({ bi: out.length, nm: nm, color: b.color, min: b.min, src: b.src, items: items });
  });
  /* ⭐ 2026-10-17 用户要求：面板只有「日清单」没有收口。
     每周日追加一个固定块：本周复盘 + 错题本承载。
     - 用 fixed 条目 → 不依赖 WEEKS 数据，任何一周都有
     - min 10，不影响其它块时长（总时长 +10，复盘本来就要 10 分钟）
     - src:"review" 不参与学科统计，但会进「本周/全程」的勾选总数（这是有意的：
       复盘也是任务，勾掉才算这周真的收了口） */
  if (!adapting && dow === 0){
    out.push({
      bi: out.length,
      nm: "📋 本周复盘",
      color: "#e3b341",
      min: 10,
      src: "review",
      items: [
        "本周完成 __ / __ 项（看上面的进度条，不到 80% 就想想是哪天塌了）",
        "这周最卡的一个点是 ________（写下来，下周第一个先啃它）",
        "错题本：本周错 2 次以上的题，抄进「薄弱清单」（别只截个图）",
        "下周只改一件事：________（只写一件，写多了等于没写）",
      ],
    });
  }
  return out;
}

/* 「试勾」：空屏时跳到下一个有内容的日子，好用勾选验证进度条 */
function nextActiveOffset(){
  for (let k = 1; k <= 14; k++){
    const d = new Date(cur.getTime() + k * DAY);
    if (d >= ADAPT_FROM) return k;
  }
  return 1;
}

function adaptTemplate(){
  const a = ADAPT[Math.max(0, Math.min(adaptIndexOf(cur), ADAPT.length - 1))];
  return [{nm: a.wd + " · 今天的清单", color: a.color, min: a.min, items: a.items}];
}
/* ⭐ 寒假算法强化：2027-01-25 ~ 02-28，算法块 +30 min/天（工作日 90→120，周末 120→150）。
   为什么：期末缓冲从 01-10 延到 01-24，吃掉了省赛前 2 周准备期；
   而 2027 省赛推算在 04-10（W25），DP + 搜索 + 图论 + 冲刺 必须挤进 W15–W24。
   寒假是唯一能加码的时段 —— 用强度补回那 2 周，**不砍任何内容**。 */
function isWinter(d){ return d >= WINTER_FROM && d <= WINTER_TO; }
/* ⭐ 2026-10-17 用户要求：**2027-01-24 之后学校课表不确定 → 取消「上课时间」的加时**
   （原来固定假设：周二上午 3h 概率连堂、周四/周五各 2h 数据结构课）。
   所以「课上加时」只在**课表已知窗口**（≤ FINAL_TO = 2027-01-24）内生效；
   01-25 起（W15，含寒假与春季学期）一律按基础模板走，不再假设任何「课上有几小时」。
   注意：带日期参数 d（默认今天）—— 统计「本周/全程」时要按被统计的那一天判断，
   否则所有周都会按「今天」算，加时/寒假加码会算错。 */
const CLASS_KNOWN_TO = FINAL_TO;   /* 2027-01-24：此后课表未知，不再假设有课 */
/* ⭐ 2026-10-17 新增：四级冲刺周（2026-12-07 ~ 12-13）—— 英语 150 min/天，
   但周二概率、周四周五数据结构保持 60 min 不动（用户明确要求）。 */
const CET4_SPRINT_FROM = new Date(2026, 11, 7);
const CET4_SPRINT_TO   = new Date(2026, 11, 13);
function isCet4Sprint(d){ return d >= CET4_SPRINT_FROM && d <= CET4_SPRINT_TO; }
function cet4Template(d){
  const m = fmt(d);
  const key = (m === "2026-12-12") ? "cet4Exam" : (m === "2026-12-13") ? "cet4After" : "cet4Work";
  return TPL[key].blocks;
}
function weekdayTemplate(dow, fin, d){
  const day = d || cur;
  const dowD = day.getDay();
  /* 四级冲刺周优先：这一周虽然也在期末缓冲窗口内，但主线是四级，模板单列。 */
  if (isCet4Sprint(day)) return cet4Template(day);
  const weekend = (dowD === 0 || dowD === 6);
  const base = (fin ? (weekend ? TPL.finalWeekend : TPL.finalWork)
                    : (weekend ? TPL.weekend : TPL.workday)).blocks;
  /* 课表已知窗口内（≤ 2027-01-24）：
     周二上午学校有 3h 概率连堂：不听讲，在课上自学 → 数学块 180 min；
     周四、周五各有 2h 数据结构课，课上自学推进王道 → 数据结构块 180 min（课上 120 + 自习 60）。
     不新增条目，只把对应块的时长拉满 —— 否则这些「坐在教室里、本来就能学」的时间会被漏算。
     期末缓冲期（fin）不加时：那时数学已是 60 min 概率复习（finalMathItems），数据结构走期末复习。 */
  if (!fin){
    let blocks = base;
    if (day <= CLASS_KNOWN_TO){
      /* 课表已知（≤ 2027-01-24）：把「坐在教室里本来就能学」的时间算进来 */
      if (dowD === 2) blocks = blocks.map(b => (b.src === "math") ? Object.assign({}, b, {min:180}) : b);
      if (dowD === 4 || dowD === 5) blocks = blocks.map(b => (b.src === "ds") ? Object.assign({}, b, {min:180}) : b);
    } else {
      /* ⭐ 2026-10-17 用户选择「3」：01-24 之后课表不确定 → 原「课上 2h」**转给 408 自学**，
         所以周二/周四/周五的 408 块仍按 180 min 排（60 基础 + 120 原课上时间），
         周二的数学不再有 3h 连堂，回到 60 min。**当天总时长不变**，只是把来源从「课上」改成「自习」。 */
      if (dowD === 2 || dowD === 4 || dowD === 5) blocks = blocks.map(b => (b.src === "ds") ? Object.assign({}, b, {min:180}) : b);
    }
    /* ⭐ 2026-10-17 用户要求：寒假 408 从 1 h 提到 1.5 h，从算法竞赛挪 30 min（当天总时长不变）。
       原因：寒假 5 周排的是「组成原理·王道一轮」，1 h/天 只够 35 h，啃不完 45–55 h 的视频；
       而算法竞赛在寒假只是保手感，减 30 min 不影响省赛（省赛 2027-04）。 */
    if (isWinter(day)) blocks = blocks.map(b => (b.src === "ds") ? Object.assign({}, b, {min: b.min + 30}) : b);
    /* ⭐ 2026-10-17 用户要求：「1-25 ~ 2-28 寒假，数学时间均分到每一天」。
       原来 5 个工作日 60 + 周六 130 + 周日 130 = 560 min/周，周末顶得很高；
       寒假每天都有整块时间 → 560 ÷ 7 = **每天 80 min**（总量一分不差，只是摊平）。
       内容分配见 mathItems 的 isWinter 分支（周四/周日高数，其余线代）。 */
    if (isWinter(day)) blocks = blocks.map(b => (b.src === "math") ? Object.assign({}, b, {min: 80}) : b);
    return blocks;
  }
  return base;
}

/* 统计某一天会用到的 key（必须与渲染完全一致）
   ⭐ 2026-10-17：加 d（那一天的日期）—— 数学块在缓冲期是 2 条、非缓冲期是 1~2 条，
     原来按「今天」算，会让缓冲周的「本周/全程」总数统计错。 */
function statKeys(dow, w, adapting, fin, wi, d){
  const keys = [];
  dayBlocks(dow, w, adapting, fin, wi, d).forEach(blk => {
    blk.items.forEach((_, ii) => keys.push(blk.bi + ":" + ii));
  });
  return keys;
}

/* 自检用：把某一天「渲染会用的 key」也算出来（不依赖 DOM） */
function planKeys(dow, w, adapting, fin, wi, d){ return statKeys(dow, w, adapting, fin, wi, d); }

/* 这一周一共多少条（用同一份 dayBlocks 算，保证跟页面上看到的一致）
   ⭐ 2026-10-17：按**每一天的真实日期**递归（dow / 是否期末缓冲 / 数学条目数都随日期变），
     否则跨缓冲边界的周（如 W7：11-30 正常 + 12-01 起缓冲）会算错。 */
function weekTotal(w, adapting, fin, wi){
  let tot = 0;
  for (let i = 0; i < 7; i++){
    const dd = new Date(START.getTime() + (wi * 7 + i) * DAY);
    tot += statKeys(dd.getDay(), w, adapting, isFinal(dd), wi, dd).length;
  }
  return tot;
}

/* 这一周已经勾了多少条：直接数「本机存的 key」，按 key 里的第几天换算成真实日期。
   这样不依赖「重新推导 key」，任何错位都不会算错。 */
function weekDone(weekStart){
  let dn = 0;
  for (let d = 0; d < 7; d++){
    const date = fmt(new Date(weekStart.getTime() + d * DAY));
    let dayState = {};
    try { dayState = JSON.parse(lsGet(KEY(date)) || "{}") || {}; } catch (e) { dayState = {}; }
    Object.keys(dayState).forEach(k => { if (dayState[k]) dn++; });
  }
  return dn;
}

/* 自检：同一天「渲染实际用的 key」和「统计用的 key」必须一字不差 */
function auditKeys(renderKeys, dow, adapting, fin, w, wi){
  const stat = statKeys(dow, w, adapting, fin, wi);
  const a = renderKeys.join("|"), b = stat.join("|");
  if (a !== b){
    auditNote = "⚠️ 自检不通过：本周/全程进度可能不准（渲染 " + a + " ≠ 统计 " + b + "）";
    return false;
  }
  return true;
}
let auditNote = "";

function render(){
  loadState();
  persistOK = true;
  saveState();          /* 探一下本机存储能不能写：不能写就立刻标出来，别等到勾选才提示 */
  const dow = cur.getDay();
  const isWeekend = (dow === 0 || dow === 6);
  const wi = weekIndex(cur);
  const adapting = cur >= ADAPT_FROM && cur <= ADAPT_TO;
  const fin = isFinal(cur);
  const w = (!adapting && wi >= 0) ? WEEKS[Math.min(wi, WEEKS.length - 1)] : null;
  const isToday = fmt(cur) === fmt(today0);
  /* ⭐ 2026-10-17：块清单提前到这里算 —— 下面的「模式：今天合计 X h」要用它求和。
     原来在 meta 之后才算，导致 modeSpan 引用未初始化变量、整个 render 抛错（块区空白）。 */
  const blocks = dayBlocks(dow, w, adapting, fin, wi, cur);
  /* 「课上加时」只在课表已知窗口内存在（≤ 2027-01-24）；之后转成 408 自学时间 */
  const classKnown = !fin && cur <= CLASS_KNOWN_TO;

  document.getElementById("dateTitle").textContent =
    fmt(cur) + " · " + WD[dow] + (isToday ? "（今天）" : "");

  /* ---- 导航：早于今天一律禁用 ---- */
  const canPrev = cur > today0;
  document.getElementById("btnPrev").disabled = !canPrev;
  document.getElementById("btnNext").disabled = cur < ADAPT_FROM;

  const badge = document.getElementById("phaseBadge");
  /* ⭐ 四级考试周（W8 = 2026-12-07 ~ 12-13，周六 12-12 考试）优先于期末缓冲：
     这一周虽然也在缓冲窗口内，但主线是四级冲刺，徽标必须说清楚。 */
  const isCet4Week = (cur >= parseDay("2026-12-07") && cur <= parseDay("2026-12-13"));
  if (adapting){ badge.textContent = "适应周（第 " + (adaptIndexOf(cur)+1) + "/" + ADAPT.length + " 天）"; badge.style.background="#1d3a55"; badge.style.color="#79c0ff"; }
  else if (isCet4Week && cur <= CET4_EXAM){ badge.textContent = "⚠️ 四级考试周" + (fmt(cur) === fmt(CET4_EXAM) ? "（今天考试）" : ""); badge.style.background="#4a1d1d"; badge.style.color="#ff7b72"; }
  else if (fin){ badge.textContent = "期末缓冲" + (isWeekend ? "（周末）" : ""); badge.style.background="#3d2f0a"; badge.style.color="#e3b341"; }
  else { badge.textContent = "正式计划 第 " + (wi+1) + " 周"; badge.style.background="#132b1a"; badge.style.color="#3fb950"; }

  /* 省赛倒计时：用户目标是冲省一，这是全程最硬的一个固定日期。 */
  const daysToProv = Math.ceil((PROVINCIAL_EXAM - cur)/DAY);
  const provSpan = (daysToProv >= 0)
    ? "<span>距蓝桥杯省赛：<b>" + daysToProv + " 天</b>（预计 04-10，以官方通知为准）</span>"
    : "<span>省赛已结束</span>";
  /* 模式行：⭐ 2026-10-17 改成**按当天实际块时长动态显示** ——
     原来写死「平时（4.5–5.5h）」，但实际工作日 5.7h、周二/四/五 7.7h、周末 8.3h，
     面板自报的时长和排出来的时长对不上（用户问「每日时间是不是有点短」时直接踩到）。
     现在直接sum 当天 blocks 的 min，永远是真实值。 */
  const dayMin = blocks.reduce((a, b) => a + (b.min || 0), 0);
  const dayH = (Math.round(dayMin / 6) / 10).toFixed(1);
  const modeSpan = "<span>模式：<b>" +
    (fin ? "期末缓冲" : (isWinter(cur) ? "寒假强化（算法 +30 min/天）" : "平时")) +
    "（今天合计 " + dayH + " h）</b></span>";

  document.getElementById("meta").innerHTML = adapting
    ? "<span>本周任务：<b>适应周（" + ADAPT.length + " 天）</b></span><span>蓝桥杯摸底：<b>本周待做</b>（2 套真题 + 失分分类）</span><span>正式计划 <b>10-19（下周一）</b> 开始</span>"
    : (isCet4Week
        ? "<span>四级考试：<b>2026-12-12（周六）</b></span>" +
          "<span>" + (cur < CET4_EXAM ? "还剩 <b>" + Math.ceil((CET4_EXAM - cur)/DAY) + " 天</b>" : "✅ <b>已考完</b>，转到下周开始红宝书") + "</span>" +
          modeSpan +
          "<span>本周第 <b>" + (wi+1) + "/" + WEEKS.length + "</b> 周</span>"
        : (fin
            ? "<span>期末缓冲：<b>考完为止</b>（预计 <b>01-24</b> 前后）</span>" +
              modeSpan +
              "<span>本周第 <b>" + (wi+1) + "/" + WEEKS.length + "</b> 周</span>"
            : (cur <= CET4_EXAM
                ? "<span>距四级考试：<b>" + Math.ceil((CET4_EXAM - cur)/DAY) + " 天</b></span>"
                : "<span>四级已考完</span>") +
              provSpan + modeSpan +
              "<span>本周第 <b>" + (wi+1) + "/" + WEEKS.length + "</b> 周</span>"));

  /* ---- 焦点区 ---- */
  const fb = document.getElementById("focus");
  if (adapting){
    const a = ADAPT[Math.max(0, Math.min(adaptIndexOf(cur), ADAPT.length - 1))];
    fb.innerHTML = "<h3>适应周要做的三件事</h3>" +
      '<div class="frow"><span class="k" style="color:#58a6ff">目标</span><span class="v">测强度：4.5–5.5h/天 能不能长期扛住</span></div>' +
      '<div class="frow"><span class="k" style="color:#e3b341">本周待做</span><span class="v">蓝桥杯摸底：2 套真题（严格计时）+ 失分三分类</span></div>' +
      '<div class="frow"><span class="k" style="color:#3fb950">今天</span><span class="v">' + esc(a ? a.wd : "—") + " · 约 " + (a ? a.min : 0) + ' min（下面只列今天这一天）</span></div>';
  } else {
    fb.innerHTML = "<h3>今天要从这几条线里各推进一步</h3>" +
      '<div class="frow"><span class="k" style="color:#a371f7">' + esc(dsLabel(w, fin)) + '</span><span class="v">' + esc(pick(w && w.ds, dow).join(" ｜ ") || "（今天无）") + "</span></div>" +
      '<div class="frow"><span class="k" style="color:#f0883e">算法竞赛</span><span class="v">' + esc(pick(w && w.algo, dow).join(" ｜ ") || "（今天无）") + "</span></div>" +
      '<div class="frow"><span class="k" style="color:#58a6ff">AI 学习</span><span class="v">' + esc(pick(aiOf(w, wi), dow).join(" ｜ ") || "（今天无）") + "</span></div>" +
      /* 数学行：原来概览只有 ds/algo/ai/英语四条线，数学整块被漏掉 ——
         而数学是每天都有内容的（概率 + 线代 + 高数），概览里必须出现。
         概览只给「一眼看今天推哪条线」，所以只放概率主题 + 总时长，
         完整三条（概率/线代/高数）在下面的任务块里，别在这儿重复一遍。 */
      '<div class="frow"><span class="k" style="color:#db6d28">数学</span><span class="v">' + esc(probLine(dow)) + "</span></div>" +
      '<div class="frow"><span class="k" style="color:#f85149">英语材料</span><span class="v">听力 ' + esc((w && w.en && dow >= 1 && dow <= 4) ? w.en[dow-1] : ((w && w.en && w.en[0]) || "—")) + ((w && w.enSent) ? " · 长难句 刘晓艳" + esc(w.enSent) : " · 长难句：已融入阅读/作文") + "</span></div>";
  }

  const box = document.getElementById("blocks");
  const adaptBox = document.getElementById("adaptBox");
  const emptyBox = document.getElementById("emptyBox");
  box.innerHTML = "";

  /* ---- 空态：早于今天 / 早于适应周 ---- */
  if (cur < ADAPT_FROM){
    adaptBox.style.display = "none";
    emptyBox.style.display = "block";
    emptyBox.innerHTML = "⚠️ " + fmt(cur) + " 早于「今天」，已不再显示。<br>" +
      "本面板一屏只显示<b>一天</b>，且只显示今天及以后；适应周从 <b>2026-10-12</b> 开始。<br>" +
      "今天是 <b>" + fmt(today0) + "</b>（" + WD[today0.getDay()] + "），你的内容在 <b>" + fmt(ADAPT_FROM) + "</b> 开始。";
    document.getElementById("barfill").style.width = "0%";
    document.getElementById("pct").textContent = "—";
    const b = document.getElementById("previewBtn");
    if (b) b.style.display = "inline-block";
    endRender();
    return;
  }
  emptyBox.style.display = "none";
  const pb0 = document.getElementById("previewBtn");
  if (pb0) pb0.style.display = "none";

  const adaptToday = ADAPT[Math.max(0, Math.min(adaptIndexOf(cur), ADAPT.length - 1))];

  if (adapting){
    adaptBox.style.display = "block";
    adaptBox.innerHTML = "<b>适应周 · " + fmt(cur) + "（" + WD[dow] + "）</b>：摸底还没做 → <b>就在这 4 天里做</b>（10-15 第 1 套 / 10-16 第 2 套 / 10-17 失分三分类 / 10-18 定弱项）。" +
      "所以正式第 1 周从<b>区间调度贪心 / 栈队列 / 手感恢复②</b>开始，跟摸底不重复。" +
      "今天跑完记下三个数字：<b>实际总时长 / 最想放弃的时段 / 哪项超时</b>。";
  } else {
    adaptBox.style.display = "none";
  }

  let total = 0, done = 0;
  const renderKeys = [];
  blocks.forEach((b) => {
    const bi = b.bi;
    const items = b.items;
    const el = document.createElement("div");
    el.className = "blk";
    let html = '<div class="hd"><span class="dot" style="background:' + b.color + '"></span>' +
               '<span class="nm">' + esc(b.nm) + "</span>" +
               '<span class="min">' + (Math.round(b.min / 6) / 10) + " h</span></div>" +
               '<div class="bd">';
    if (!adapting && b.src){
      /* 「本周」只给个概览：本周前 3 条 + …，今天具体做什么看下面列出的条目 */
      const brief = arr => {
        const L = (arr || []).map(x => x.t);
        return L.length > 3 ? L.slice(0, 3).join("｜") + "｜… 共 " + L.length + " 项" : L.join("｜");
      };
      /* ⚠️ 这里必须每个 src 都有分支。
         原来 math 没有分支 → 落进最后的 else → 数学块显示了 AI 的周计划
         （现象：「AI 学习」和「数学」两块内容一模一样）。
         数学的内容来自 mathItems()，不是 w.math —— 所以单独取。 */
      const v = b.src === "en"  ? (w.en || []).join("｜")
              : b.src === "ds"  ? brief(w.ds)
              : b.src === "algo"? brief(w.algo)
              : b.src === "ai"  ? brief(w.ai)
              : b.src === "math"? mathItems(dow).join("｜")
              :                   "";
      if (v) html += '<div class="wk">本周概览：' + esc(v) + "</div>";
      /* 这天有课时（周二概率 3h / 周四五数据结构 2h），块时长被拉长 → 说明一句，
         否则「3h 的数据结构」看着像任务量翻了三倍，实际是课上时间被算进来了。
         ⭐ 2026-10-17：只在**课表已知窗口**（≤ 2027-01-24）显示；之后课表不确定、也不再加时。 */
      if (!adapting && classKnown && b.src === "math" && dow === 2)
        html += '<div class="wk" style="color:#3fb950;background:#0d1c12;border-color:#1f3d26">📌 含学校课上 3h（不听讲，按自己节奏推网课 + 做题）</div>';
      if (!adapting && classKnown && b.src === "ds" && (dow === 4 || dow === 5))
        html += '<div class="wk" style="color:#3fb950;background:#0d1c12;border-color:#1f3d26">📌 含学校课上 2h（课上自学推进王道）</div>';
      /* ⭐ 2026-10-17：01-24 之后课表不确定 → 原「课上 2h」已转成 408 自学时间（仍按 3 h 排） */
      if (!adapting && !classKnown && !fin && b.src === "ds" && (dow === 2 || dow === 4 || dow === 5))
        html += '<div class="wk" style="color:#3fb950;background:#0d1c12;border-color:#1f3d26">📌 课表未定：原「课上 2h」已转为 408 自学时间（本块 3 h）</div>';
    }
    html += "<ul></ul></div>";
    el.innerHTML = html;
    const ul = el.querySelector("ul");
    let bDone = 0;
    items.forEach((t, ii) => {
      const id = bi + ":" + ii;
      const marked = isMarked(id);
      if (marked) bDone++;
      const li = document.createElement("li");
      if (marked) li.classList.add("done");
      const tag = adapting ? "" : '<span class="daytag">' + DAY_CN[dow] + "</span>";
      li.innerHTML = '<input type="checkbox" ' + (marked ? "checked" : "") + '><span>' + tag + esc(t) + "</span>";
      const tg = () => {
        try {
          if (isMarked(id)) unmark(id); else mark(id);
          render();
        } catch (e) {
          const f = document.getElementById("foot");
          if (f) f.innerHTML = '<b style="color:#f85149">勾选失败：</b>' + e.message + "（按 Ctrl+F5 刷新后重试）";
        }
      };
      li.querySelector("input").addEventListener("change", tg);
      li.querySelector("span").addEventListener("click", tg);
      ul.appendChild(li);
    });
    total += items.length; done += bDone;
    if (items.length && bDone === items.length) el.classList.add("complete");
    box.appendChild(el);
  });

  const pct = total ? Math.round(done / total * 100) : 0;
  document.getElementById("barfill").style.width = pct + "%";
  document.getElementById("pct").textContent = pct + "%";

  /* ---- 今日 / 本周 / 全程 三行进度 ---- */
  auditNote = "";
  let wkDone = 0, wkTotal = 0, allDone = 0;
  const idx = Math.min(wi, WEEKS.length - 1);
  if (!adapting && idx >= 0){
    const wkStart = new Date(START.getTime() + idx * 7 * DAY);
    wkTotal = WEEK_TOTAL[idx];
    wkDone = preview ? 0 : weekDone(wkStart);
    allDone = WEEK_TOTAL.slice(0, idx).reduce((a,b) => a + b, 0) + wkDone;
  }

  const f = document.getElementById("foot");
  if (f) f.innerHTML =
    (preview ? '<div style="color:#e3b341"><b>试勾模式</b>：你正在试勾 ' + fmt(cur) + " 这一天，" +
               '<b>不会计入正式进度</b>。<button onclick="stopPreview()" style="margin-left:6px;background:#1c232c;color:#e6edf3;border:1px solid #283039;border-radius:6px;padding:2px 8px;cursor:pointer;font-family:inherit">退出试勾</button></div>' : "") +
    "<div>今日进度 <b>" + done + "/" + total + " · " + pct + "%</b>　" +
      (adapting ? "（适应周第 " + (adaptIndexOf(cur)+1) + "/" + ADAPT.length + " 天）"
                : "本周进度 <b>" + wkDone + "/" + wkTotal + "</b>　全程 " + allDone + "/" + WEEK_ALL) +
    "</div>" +
    (persistOK ? "勾选按「日期」分别保存（localStorage）· " + esc(savedAtText()) + "（每次勾选都会自动存，也可以点「💾 保存进度」）"
               : '<b style="color:#f0883e">⚠️ 本机浏览器禁用了本地存储：勾选只在本次打开期间有效，关掉页面会丢 —— 请用「⬇️ 导出备份」把进度存成文件</b>') +
    " · 一屏只显示一天 · 每周明细已拆到「天」<br>本面板管「今天做什么」；「整个计划」看 <b>进度看板.html</b>";

  endRender();
}

/* 通知外部「这一轮渲染结束」（自测脚本靠它区分新旧 DOM） */
function endRender(){
  if (typeof window !== "undefined" && typeof window.__dshRenderEnd === "function") window.__dshRenderEnd();
}

/* ---- 全程总任务数 + 每周任务数 ---- */
const WEEK_TOTAL = WEEKS.map((w, i) => weekTotal(w, false, isFinal(new Date(START.getTime() + i*7*DAY)), i));
const WEEK_ALL = WEEK_TOTAL.reduce((a, b) => a + b, 0);

/* 用 DOMContentLoaded + try/catch 启动：任何异常都显示在页脚，不再白屏 */
document.addEventListener("DOMContentLoaded", function () {
  try {
    render();
  } catch (e) {
    var f = document.getElementById("foot");
    if (f) f.innerHTML = '<b style="color:#f85149">面板启动失败：</b>' + e.message + "（按 Ctrl+F5 刷新）";
  }
});
</script>

render();
</script>
</body>
</html>
